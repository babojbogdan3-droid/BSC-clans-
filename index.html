<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Strike Clans</title>
    <script src="https://telegram.org/js/telegram.min.js"></script>
    <style>
        /* ============================================================
           СТИЛИ (с анимациями и улучшениями)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0e14;
            --card: #141b24;
            --border: #2a3344;
            --text: #e8edf5;
            --muted: #8b9bb5;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.25);
            --success: #2ea043;
            --danger: #f85149;
            --gold: #ffd700;
            --radius: 14px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.03) 0%, transparent 60%),
                              radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.02) 0%, transparent 50%);
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
        }
        /* ХЕДЕР */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .profile-btn-wrap {
            position: relative;
        }
        .profile-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .profile-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
        }
        .profile-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .profile-dropdown {
            position: absolute;
            top: 52px;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            min-width: 240px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 200;
            animation: fadeIn 0.2s ease;
        }
        .profile-dropdown.show {
            display: block;
        }
        .profile-dropdown .info {
            margin-bottom: 10px;
        }
        .profile-dropdown .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .profile-dropdown .info .detail {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        /* КАРТОЧКИ */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.4s ease;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
        }
        .card-tag {
            color: var(--accent);
            font-weight: 700;
            font-size: 15px;
            background: rgba(0, 212, 255, 0.08);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        .card-sub {
            color: var(--muted);
            font-size: 13px;
            margin: 4px 0 8px 0;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* КНОПКИ */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--accent);
            color: #0a0e14;
        }
        .btn-primary:hover {
            box-shadow: 0 0 24px var(--accent-glow);
            transform: scale(1.02);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #3a4558;
        }
        .btn-gold {
            background: var(--gold);
            color: #0a0e14;
        }
        .btn-gold:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* МОДАЛКИ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.3s ease;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .modal input,
        .modal select,
        .modal textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border 0.3s;
        }
        .modal input:focus,
        .modal select:focus,
        .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg);
            border-radius: 6px;
            font-size: 14px;
            border-left: 3px solid var(--accent);
        }
        .member-row .role-tag {
            font-size: 11px;
            color: var(--muted);
            background: var(--border);
            padding: 0 8px;
            border-radius: 10px;
        }
        .member-row .actions {
            display: flex;
            gap: 4px;
        }

        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .request-item:last-child {
            border-bottom: none;
        }
        .request-item .req-name {
            font-weight: 500;
        }
        .request-item .req-date {
            color: var(--muted);
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
        }
        .empty .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: var(--muted);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Toast-уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 2000;
            animation: fadeInUp 0.3s ease;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
        }
        .toast.info {
            border-color: var(--accent);
        }

        @media (max-width: 480px) {
            .header-left h1 {
                font-size: 18px;
            }
            .modal {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <h1>⚔️ BSC Clans</h1>
            </div>
            <div class="profile-btn-wrap">
                <button class="profile-btn" onclick="toggleProfile()">
                    👤
                    <span class="badge" id="notifBadge" style="display:none;">0</span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="info">
                        <div class="name" id="profName">Неизвестно</div>
                        <div class="detail" id="profGameId">Игровой ID: —</div>
                        <div class="detail" id="profUsername">Telegram: —</div>
                        <div class="detail" id="profClan">Клан: —</div>
                        <div class="detail" id="profRole">Роль: —</div>
                    </div>
                    <button class="btn btn-secondary btn-block btn-sm" onclick="openEditProfile()">✏️ Редактировать профиль</button>
                    <button class="btn btn-danger btn-block btn-sm" onclick="logoutUser()" style="margin-top:6px;">🚪 Выйти и удалить данные</button>
                </div>
            </div>
        </header>

        <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="showTab('clans')" id="tabClans">🔴 КЛАНЫ</button>
            <button class="btn btn-secondary" onclick="showTab('requests')" id="tabRequests">📩 ЗАЯВКИ</button>
            <button class="btn btn-secondary" onclick="showTab('myclan')" id="tabMyClan">⭐ МОЙ КЛАН</button>
            <button class="btn btn-secondary" onclick="showTab('admin')" id="tabAdmin" style="display:none;">🛡️ АДМИН</button>
        </div>

        <div id="content">
            <div class="loading"><div class="spinner"></div>Загрузка...</div>
        </div>

        <div id="mainActionButton" style="margin-top:12px;"></div>

        <footer class="footer">Создатель: @NoisyBoy141</footer>
    </div>

    <!-- МОДАЛКА РЕГИСТРАЦИИ -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <h2>📝 Добро пожаловать!</h2>
            <p style="color:var(--muted); margin-bottom:12px;">Заполните данные для входа.</p>
            <label>Ваш никнейм</label>
            <input type="text" id="regName" placeholder="s1m1" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="regTelegram" placeholder="NoisyBoy141" maxlength="32">
            <label>Игровой ID (число)</label>
            <input type="text" id="regGameId" placeholder="22887924" maxlength="15">
            <label>Роль</label>
            <select id="regRole">
                <option value="member">Игрок</option>
                <option value="leader">Лидер</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="registerUser()">✅ Войти</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal">
            <h2>✏️ Редактировать профиль</h2>
            <label>Никнейм</label>
            <input type="text" id="editProfName" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="editProfTelegram" maxlength="32">
            <label>Игровой ID</label>
            <input type="text" id="editProfGameId" maxlength="15">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editProfileModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СОЗДАНИЯ КЛАНА -->
    <div class="modal-overlay" id="createClanModal">
        <div class="modal">
            <h2>➕ Создать клан</h2>
            <label>Название клана</label>
            <input type="text" id="newClanName" placeholder="Введите название" maxlength="30">
            <label>Тег (2-6 символов)</label>
            <input type="text" id="newClanTag" placeholder="DL" maxlength="6" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="newClanDesc" placeholder="Краткое описание"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('createClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createClan()">Создать</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ КЛАНА -->
    <div class="modal-overlay" id="editClanModal">
        <div class="modal">
            <h2>✏️ Редактировать клан</h2>
            <label>Название</label>
            <input type="text" id="editClanName">
            <label>Тег</label>
            <input type="text" id="editClanTag" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="editClanDesc"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveEditClan()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПРОСМОТРА КЛАНА -->
    <div class="modal-overlay" id="clanDetailModal">
        <div class="modal">
            <h2 id="detailClanName">🏰 Название</h2>
            <div id="detailClanInfo"></div>
            <div id="detailMembers" class="member-list"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('clanDetailModal')">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- TOAST-УВЕДОМЛЕНИЕ -->
    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // НАСТРОЙКИ
        // ============================================================
        const JSONBIN_BIN_ID = '6a6b0926da38895dfea333a8';
        const JSONBIN_API_KEY = '$2a$10$ykxy38WFCVMPvywkDdXvPuovLJRzEYFxED2JkFVD6XnyZ3pRERQF.';
        const ADMIN_GAME_ID = '22887924'; // ТВОЙ ИГРОВОЙ ID

        let currentUser = null;
        let allUsers = [];
        let allClans = [];
        let allRequests = [];
        let currentTab = 'clans';
        let editingClanId = null;

        // ============================================================
        // РАБОТА С JSONBin
        // ============================================================
        async function loadData() {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const json = await resp.json();
            return json.record || { users: [], clans: [], requests: [], settings: { adminGameId: ADMIN_GAME_ID } };
        }

        async function saveData(data) {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(data)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.json();
        }

        // ============================================================
        // TOAST-УВЕДОМЛЕНИЯ
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function isAdmin(user) {
            return user && user.gameId === ADMIN_GAME_ID;
        }

        function getUserName(id) {
            const user = allUsers.find(u => u.id === id);
            return user ? user.name : id;
        }

        function getUserTelegram(id) {
            const user = allUsers.find(u => u.id === id);
            return user ? user.telegramUsername : '';
        }

        function getClanLeader(clan) {
            return allUsers.find(u => u.id === clan.leaderId);
        }

        function getClanMembers(clan) {
            return clan.members || [];
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function initApp() {
            try {
                const data = await loadData();
                allUsers = data.users || [];
                allClans = data.clans || [];
                allRequests = data.requests || [];

                const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
                let tgId = tg ? tg.id.toString() : null;

                if (!tgId) {
                    let savedId = localStorage.getItem('bsc_test_id');
                    if (!savedId) {
                        savedId = 'test_' + Date.now();
                        localStorage.setItem('bsc_test_id', savedId);
                    }
                    tgId = savedId;
                }

                let user = allUsers.find(u => u.id === tgId);

                if (user) {
                    if (user.banned === true) {
                        document.getElementById('content').innerHTML = `
                            <div class="card" style="border-color:var(--danger);">
                                <div style="color:var(--danger);font-size:20px;">⛔ ДОСТУП ЗАПРЕЩЁН</div>
                                <div style="color:var(--muted);">Ваш аккаунт был забанен администратором.</div>
                            </div>
                        `;
                        return;
                    }
                    if (isAdmin(user) && user.role !== 'admin') {
                        user.role = 'admin';
                        const updateData = await loadData();
                        const target = updateData.users.find(u => u.id === user.id);
                        if (target) {
                            target.role = 'admin';
                            await saveData(updateData);
                        }
                        allUsers = updateData.users || [];
                    }
                    currentUser = user;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                } else {
                    showRegisterModal();
                    return;
                }

                updateUI();
                showTab('clans');
                renderMainActionButton();

            } catch (error) {
                console.error('Init error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="card" style="border-color:var(--danger);">
                        <div style="color:var(--danger);">❌ Ошибка загрузки данных</div>
                        <div style="color:var(--muted);font-size:13px;">${error.message}</div>
                        <button class="btn btn-primary" style="margin-top:10px;" onclick="initApp()">🔄 Обновить</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // РЕГИСТРАЦИЯ
        // ============================================================
        function showRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
        }

        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const telegram = document.getElementById('regTelegram').value.trim();
            const gameId = document.getElementById('regGameId').value.trim();
            const role = document.getElementById('regRole').value;

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!telegram) return showToast('❌ Введите Telegram username', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ Игровой ID должен быть числом', 'error');

            const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
            let tgId = tg ? tg.id.toString() : localStorage.getItem('bsc_test_id');
            if (!tgId) {
                tgId = 'test_' + Date.now();
                localStorage.setItem('bsc_test_id', tgId);
            }

            if (allUsers.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                return showToast('❌ Этот ник уже занят', 'error');
            }

            const isAdminUser = gameId === ADMIN_GAME_ID;

            const newUser = {
                id: tgId,
                name: name,
                telegramUsername: telegram.startsWith('@') ? telegram : '@' + telegram,
                gameId: gameId,
                role: isAdminUser ? 'admin' : role,
                clanId: null
            };

            allUsers.push(newUser);
            const data = await loadData();
            data.users = allUsers;
            await saveData(data);

            currentUser = newUser;
            localStorage.setItem('bsc_user', JSON.stringify(currentUser));

            document.getElementById('registerModal').classList.remove('show');
            showToast('✅ Добро пожаловать, ' + name + '!', 'success');
            updateUI();
            showTab('clans');
            renderMainActionButton();
        }

        // ============================================================
        // РЕДАКТИРОВАНИЕ ПРОФИЛЯ
        // ============================================================
        function openEditProfile() {
            if (!currentUser) return;
            document.getElementById('editProfName').value = currentUser.name || '';
            document.getElementById('editProfTelegram').value = (currentUser.telegramUsername || '').replace('@', '');
            document.getElementById('editProfGameId').value = currentUser.gameId || '';
            document.getElementById('editProfileModal').classList.add('show');
            document.getElementById('profileDropdown').classList.remove('show');
        }

        async function saveProfile() {
            const name = document.getElementById('editProfName').value.trim();
            const telegram = document.getElementById('editProfTelegram').value.trim();
            const gameId = document.getElementById('editProfGameId').value.trim();

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!telegram) return showToast('❌ Введите Telegram username', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ Игровой ID должен быть числом', 'error');

            try {
                const data = await loadData();
                const user = data.users.find(u => u.id === currentUser.id);
                if (!user) return showToast('❌ Пользователь не найден', 'error');

                if (user.name.toLowerCase() !== name.toLowerCase()) {
                    if (data.users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                        return showToast('❌ Этот ник уже занят', 'error');
                    }
                }

                user.name = name;
                user.telegramUsername = telegram.startsWith('@') ? telegram : '@' + telegram;
                user.gameId = gameId;

                await saveData(data);
                await refreshData();
                closeModal('editProfileModal');
                showToast('✅ Профиль обновлён!', 'success');
                updateUI();
                showTab(currentTab);

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // ОБНОВЛЕНИЕ UI
        // ============================================================
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('profName').textContent = currentUser.name || 'Неизвестно';
            document.getElementById('profGameId').textContent = `Игровой ID: ${currentUser.gameId || '—'}`;
            document.getElementById('profUsername').textContent = `Telegram: ${currentUser.telegramUsername || '—'}`;
            const clan = allClans.find(c => c.id === currentUser.clanId);
            document.getElementById('profClan').textContent = `Клан: ${clan ? clan.name : '—'}`;
            document.getElementById('profRole').textContent = `Роль: ${currentUser.role === 'admin' ? 'Админ' : currentUser.role === 'leader' ? 'Лидер' : 'Игрок'}`;

            const adminTab = document.getElementById('tabAdmin');
            if (isAdmin(currentUser)) {
                adminTab.style.display = 'inline-block';
            } else {
                adminTab.style.display = 'none';
            }

            const pendingRequests = allRequests.filter(r => {
                const clan = allClans.find(c => c.id === r.clanId);
                return clan && clan.leaderId === currentUser.id && r.status === 'pending';
            });
            const badge = document.getElementById('notifBadge');
            if (pendingRequests.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = pendingRequests.length;
            } else {
                badge.style.display = 'none';
            }

            renderMainActionButton();
        }

        // ============================================================
        // ГЛАВНАЯ КНОПКА
        // ============================================================
        function renderMainActionButton() {
            const container = document.getElementById('mainActionButton');
            if (!currentUser) {
                container.innerHTML = '';
                return;
            }

            if (!currentUser.clanId) {
                container.innerHTML = `
                    <button class="btn btn-primary btn-block" onclick="openCreateClan()">
                        ➕ СОЗДАТЬ КЛАН
                    </button>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        // ============================================================
        // ВКЛАДКИ
        // ============================================================
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('#tabClans, #tabRequests, #tabMyClan, #tabAdmin')
                .forEach(b => b.className = 'btn btn-secondary');
            const btnMap = {
                'clans': 'tabClans',
                'requests': 'tabRequests',
                'myclan': 'tabMyClan',
                'admin': 'tabAdmin'
            };
            const activeBtn = document.getElementById(btnMap[tab]);
            if (activeBtn) activeBtn.className = 'btn btn-primary';

            const container = document.getElementById('content');
            switch (tab) {
                case 'clans':
                    renderClans(container);
                    break;
                case 'requests':
                    renderRequests(container);
                    break;
                case 'myclan':
                    renderMyClan(container);
                    break;
                case 'admin':
                    renderAdmin(container);
                    break;
                default:
                    container.innerHTML = '<div class="empty">Неизвестная вкладка</div>';
            }
        }

        // ============================================================
        // РЕНДЕР КЛАНОВ
        // ============================================================
        async function renderClans(container) {
            await refreshData();
            if (allClans.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="icon">📭</span>
                        <p>Нет созданных кланов</p>
                        <p style="font-size:13px;">Нажмите «Создать клан» чтобы начать</p>
                    </div>
                `;
                return;
            }

            let html = '';
            allClans.forEach(clan => {
                const members = getClanMembers(clan);
                const isLeader = clan.leaderId === currentUser.id;
                const isMember = members.includes(currentUser.id);
                const isAdminUser = isAdmin(currentUser);
                const leader = getClanLeader(clan);

                const showApply = !isMember && !isLeader && !currentUser.clanId;
                const showDelete = isLeader || isAdminUser;
                const showEdit = isLeader || isAdminUser;

                const leaderDisplay = leader ?
                    `${leader.name} (${leader.telegramUsername || 'нет username'})` :
                    'Неизвестен';

                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${clan.name}</span>
                            <span class="card-tag">[${clan.tag}]</span>
                        </div>
                        <div class="card-sub">
                            Глава: ${leaderDisplay}
                            • 👥 ${members.length} участников
                        </div>
                        ${clan.description ? `<div style="color:var(--muted);font-size:13px;margin-bottom:6px;">📝 ${clan.description}</div>` : ''}
                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="viewClan('${clan.id}')">👁️ Просмотр</button>
                            ${showApply ? `<button class="btn btn-success btn-sm" onclick="applyToClan('${clan.id}')">📩 Подать заявку</button>` : ''}
                            ${showDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteClan('${clan.id}')">🗑 Распустить</button>` : ''}
                            ${showEdit ? `<button class="btn btn-primary btn-sm" onclick="openEditClan('${clan.id}')">✏️ Редактировать</button>` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // РЕНДЕР ЗАЯВОК
        // ============================================================
        async function renderRequests(container) {
            await refreshData();

            const myClan = allClans.find(c => c.leaderId === currentUser.id);
            if (!myClan) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="icon">📩</span>
                        <p>Вы не являетесь главой клана</p>
                        <p style="font-size:13px;">Только глава клана может просматривать и управлять заявками.</p>
                    </div>
                `;
                return;
            }

            const pending = allRequests.filter(r => r.clanId === myClan.id && r.status === 'pending');
            if (pending.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="icon">✅</span>
                        <p>Нет входящих заявок</p>
                    </div>
                `;
                return;
            }

            let html = `<div style="color:var(--muted);margin-bottom:12px;">📨 Входящие заявки (${pending.length}):</div>`;
            pending.forEach(req => {
                const user = allUsers.find(u => u.id === req.userId);
                html += `
                    <div class="request-item">
                        <div>
                            <div class="req-name">${user ? user.name : req.userName || 'Игрок'}</div>
                            <div class="req-date">ID: ${req.userId}</div>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button class="btn btn-success btn-sm" onclick="acceptRequest('${req.id}')">✅ Принять</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectRequest('${req.id}')">❌ Отклонить</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // РЕНДЕР МОЙ КЛАН
        // ============================================================
        async function renderMyClan(container) {
            await refreshData();
            if (!currentUser.clanId) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="icon">⭐</span>
                        <p>Вы не состоите в клане</p>
                        <p style="font-size:13px;">Создайте свой клан или подайте заявку в существующий</p>
                    </div>
                `;
                return;
            }

            const clan = allClans.find(c => c.id === currentUser.clanId);
            if (!clan) {
                container.innerHTML = `
                    <div class="empty">
                        <span class="icon">⚠️</span>
                        <p>Ваш клан был удалён</p>
                        <button class="btn btn-primary" onclick="clearMyClan()">🔄 Обновить</button>
                    </div>
                `;
                return;
            }

            const isLeader = clan.leaderId === currentUser.id;
            const leader = getClanLeader(clan);

                    </div>

            container.innerHTML = `
                <div class="card" style="border-color:var(--accent);">
                    <div class="card-header">
                        <span class="card-title">${clan.name}</span>

                    </div>
                    <div class="card-sub">
                        Глава: ${leader ? `${leader.name} (${leader.telegramUsername || 'нет username'})` : 'Неизвестен'}
                        • 👥 ${members.length} участников
                    </div>
                    ${clan.description ? `<div style="color:var(--muted);font-size:13px;">📝 ${clan.description}</div>` : ''}
                    <div style="margin-top:12px;">

        // ============================================================
        // РЕНДЕР АДМИНКИ
        // ============================================================
        async function renderAdmin(container) {
            if (!isAdmin(currentUser)) {
                container.innerHTML = '<div class="empty">⛔ Доступ запрещён</div>';
                return;
            }

            await refreshData();
            let html = `
                <div class="card" style="border-color:var(--gold);">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <h3>🛡️ Админ-панель</h3>
                        <span style="color:var(--gold);font-size:13px;">Вы вошли как администратор</span>
                    </div>
                    <div style="margin-top:12px;">
                        <div style="color:var(--muted);">Всего кланов: ${allClans.length}</div>
                        <div style="color:var(--muted);">Всего пользователей: ${allUsers.length}</div>
                        <div style="color:var(--muted);">Заявок в обработке: ${allRequests.filter(r => r.status === 'pending').length}</div>
                        <div style="color:var(--muted);">Админ Game ID: ${ADMIN_GAME_ID}</div>
                    </div>
                    <div style="margin-top:12px;">
                        <button class="btn btn-danger btn-sm" onclick="clearAllData()">⚠️ Очистить все данные</button>
                    </div>
                </div>
            `;

            if (allUsers.length > 0) {
                html += `<div style="margin-top:16px;"><h4>Все пользователи:</h4>`;
                allUsers.forEach(user => {
                    const isUserAdmin = isAdmin(user);
                    const isBanned = user.banned === true;
                    html += `
                        <div class="card" style="border-color:${isUserAdmin ? 'var(--gold)' : 'var(--border)'};">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                <div>
                                    <strong>${user.name}</strong>
                                    ${isUserAdmin ? '👑' : ''}
                                    ${isBanned ? '🔨' : ''}
                                    <div style="color:var(--muted);font-size:12px;">ID: ${user.id}</div>
                                    <div style="color:var(--muted);font-size:12px;">Game ID: ${user.gameId}</div>
                                </div>
                                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                                    ${!isUserAdmin ? `
                                        <button class="btn btn-danger btn-sm" onclick="adminDeleteUser('${user.id}')">❌ Удалить</button>
                                        ${isBanned ? 
                                            `<button class="btn btn-success btn-sm" onclick="adminUnbanUser('${user.id}')">✅ Разбанить</button>` :
                                            `<button class="btn btn-danger btn-sm" onclick="adminBanUser('${user.id}')">🔨 Забанить</button>`
                                        }
                                    ` : `
                                        <span style="color:var(--gold);font-size:12px;">👑 Администратор</span>
                                    `}
                                </div>
                            </div>
                        </div>

            }

            container.innerHTML = html;
        }

        // ============================================================
        // АДМИН: УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ
        // ============================================================
        async function adminDeleteUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя удалить администратора!', 'error');
            if (!confirm(`❌ Точно удалить пользователя "${user.name}" (${user.id})?\nВсе его данные будут удалены.`)) return;

            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== userId);
                data.clans.forEach(clan => {
                    if (clan.members) {
                        clan.members = clan.members.filter(m => m !== userId);
                    }
                    if (clan.leaderId === userId) {
                        const newLeader = clan.members && clan.members.length > 0 ? clan.members[0] : null;
                        if (newLeader) {
                            const leaderUser = data.users.find(u => u.id === newLeader);
                            clan.leaderId = newLeader;
                            clan.leaderName = leaderUser ? leaderUser.name : 'Неизвестен';
                        } else {
                            data.clans = data.clans.filter(c => c.id !== clan.id);
                        }
                    }
                });
                data.requests = data.requests.filter(r => r.userId !== userId);
                await saveData(data);
                await refreshData();
                showToast(`✅ Пользователь "${user.name}" удалён`, 'success');
                showTab('admin');
            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function adminBanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя забанить администратора!', 'error');
            if (!confirm(`🔨 Забанить пользователя "${user.name}" (${user.id})?\nОн не сможет войти в систему.`)) return;

            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) {
                    target.banned = true;
                }
                await saveData(data);
                await refreshData();
                showToast(`✅ Пользователь "${user.name}" забанен`, 'success');
                showTab('admin');
            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function adminUnbanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (!confirm(`✅ Разбанить пользователя "${user.name}"?`)) return;

            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) {
                    target.banned = false;
                }
                await saveData(data);
                await refreshData();
                showToast(`✅ Пользователь "${user.name}" разбанен`, 'success');
                showTab('admin');
            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // РЕДАКТИРОВАНИЕ КЛАНА (ДЛЯ ЛИДЕРА/АДМИНА)
        // ============================================================
        function openEditClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) {
                return showToast('❌ Нет прав', 'error');
            }
            editingClanId = clanId;
            document.getElementById('editClanName').value = clan.name;
            document.getElementById('editClanTag').value = clan.tag;
            document.getElementById('editClanDesc').value = clan.description || '';
            document.getElementById('editClanModal').classList.add('show');
        }

        async function saveEditClan() {
            const name = document.getElementById('editClanName').value.trim();
            const tag = document.getElementById('editClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('editClanDesc').value.trim();

            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === editingClanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');

                clan.name = name;
                clan.tag = tag;
                clan.description = desc;

                await saveData(data);
                await refreshData();
                closeModal('editClanModal');
                showToast('✅ Клан обновлён', 'success');
                showTab(currentTab);
            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // ПРОСМОТР КЛАНА (С КНОПКОЙ "ПОКИНУТЬ")
        // ============================================================
        async function viewClan(clanId) {
            await refreshData();
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');

            const members = getClanMembers(clan);
            const leader = getClanLeader(clan);
            const isLeader = clan.leaderId === currentUser.id;
            const isAdminUser = isAdmin(currentUser);
            const canManage = isLeader || isAdminUser;

            document.getElementById('detailClanName').textContent = `🏰 ${clan.name} [${clan.tag}]`;
            document.getElementById('detailClanInfo').innerHTML = `
                <div style="color:var(--muted);font-size:14px;margin-bottom:8px;">
                    Глава: ${leader ? `${leader.name} (${leader.telegramUsername || 'нет username'})` : 'Неизвестен'}
                    • 👥 ${members.length} участников
                    ${clan.description ? `<br>📝 ${clan.description}` : ''}
                </div>
            `;

            let membersHtml = '';
            members.forEach(mid => {
                const user = allUsers.find(u => u.id === mid);
                const isLeaderUser = mid === clan.leaderId;
                const isCurrentUser = mid === currentUser.id;

                let actionsHtml = '';

                if (canManage && !isLeaderUser && mid !== currentUser.id) {
                    actionsHtml += `
                        <button class="btn btn-danger btn-sm" onclick="kickMember('${clan.id}', '${mid}')">Кикнуть</button>
                        <button class="btn btn-gold btn-sm" onclick="transferLeadership('${clan.id}', '${mid}')">👑 Назначить лидером</button>
                    `;
                } else if (canManage && isLeaderUser && mid === currentUser.id) {
                    actionsHtml += `
                        <button class="btn btn-gold btn-sm" onclick="transferLeadership('${clan.id}', '${mid}')">👑 Передать лидерство</button>
                    `;
                }

                if (isCurrentUser && !isLeaderUser) {
                    actionsHtml += `
                        <button class="btn btn-danger btn-sm" onclick="confirmLeaveFromView('${clan.id}')">🚪 Покинуть</button>
                    `;
                }

                if (actionsHtml) {
                    actionsHtml = `<div class="actions">${actionsHtml}</div>`;
                }

                membersHtml += `
                    <div class="member-row">
                        <span>${user ? user.name : mid} ${isLeaderUser ? '👑' : ''}</span>
                        ${actionsHtml}
                    </div>
                `;
            });

            document.getElementById('detailMembers').innerHTML = membersHtml || '<div style="color:var(--muted);">Нет участников</div>';
            document.getElementById('clanDetailModal').classList.add('show');
        }

        // ============================================================
        // ПОДТВЕРЖДЕНИЕ ВЫХОДА
        // ============================================================
        function confirmLeaveFromView(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (confirm(`Вы действительно хотите выйти из клана "${clan.name}"?`)) {
                leaveClan(clanId);
                closeModal('clanDetailModal');
            }
        }

        // ============================================================
        // ДЕЙСТВИЯ С КЛАНАМИ
        // ============================================================
        function openCreateClan() {
            if (currentUser.clanId) {
                return showToast('❌ Вы уже в клане', 'error');
            }
            document.getElementById('newClanName').value = '';
            document.getElementById('newClanTag').value = '';
            document.getElementById('newClanDesc').value = '';
            document.getElementById('createClanModal').classList.add('show');
        }

        async function createClan() {
            const name = document.getElementById('newClanName').value.trim();
            const tag = document.getElementById('newClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('newClanDesc').value.trim();

            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                if (data.clans.find(c => c.name.toLowerCase() === name.toLowerCase())) {
                    return showToast('❌ Клан с таким названием уже существует', 'error');
                }

                const newClan = {
                    id: 'clan_' + Date.now(),
                    name: name,
                    tag: tag,
                    leaderId: currentUser.id,
                    members: [currentUser.id],
                    description: desc,
                    created: new Date().toISOString()
                };

                data.clans.push(newClan);
                await saveData(data);

                currentUser.clanId = newClan.id;
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));

                await refreshData();
                closeModal('createClanModal');
                showToast('✅ Клан создан!', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function applyToClan(clanId) {
            if (currentUser.clanId) {
                return showToast('❌ Вы уже в клане', 'error');
            }

            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');

            if (allRequests.find(r => r.clanId === clanId && r.userId === currentUser.id && r.status === 'pending')) {
                return showToast('⏳ Вы уже подали заявку в этот клан', 'info');
            }

            if (!confirm(`Подать заявку в клан "${clan.name}" [${clan.tag}]?`)) return;

            try {
                const data = await loadData();
                const newReq = {
                    id: 'req_' + Date.now(),
                    clanId: clanId,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    status: 'pending',
                    created: new Date().toISOString()
                };
                data.requests.push(newReq);
                await saveData(data);

                await refreshData();
                showToast('✅ Заявка отправлена!', 'success');
                showTab('clans');

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function acceptRequest(requestId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === requestId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');

                const clan = data.clans.find(c => c.id === req.clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');

                if (!clan.members) clan.members = [];
                if (!clan.members.includes(req.userId)) {
                    clan.members.push(req.userId);
                }

                req.status = 'accepted';

                const user = data.users.find(u => u.id === req.userId);
                if (user) {
                    user.clanId = clan.id;
                }

                await saveData(data);
                await refreshData();
                showToast('✅ Заявка принята!', 'success');
                showTab('requests');

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function rejectRequest(requestId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === requestId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');
                req.status = 'rejected';
                await saveData(data);
                await refreshData();
                showToast('❌ Заявка отклонена', 'error');
                showTab('requests');

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function deleteClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');

            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) {
                return showToast('❌ Только лидер или админ может удалить клан', 'error');
            }

            if (!confirm(`❌ Точно удалить клан "${clan.name}"?`)) return;

            try {
                const data = await loadData();
                data.clans = data.clans.filter(c => c.id !== clanId);
                data.requests = data.requests.filter(r => r.clanId !== clanId);
                data.users.forEach(u => {
                    if (u.clanId === clanId) u.clanId = null;
                });
                if (currentUser.clanId === clanId) {
                    currentUser.clanId = null;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
                await saveData(data);
                await refreshData();
                showToast('✅ Клан удалён', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function leaveClan(clanId) {
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');

                if (clan.leaderId === currentUser.id) {
                    return showToast('❌ Вы глава клана. Сначала передайте лидерство или распустите клан.', 'error');
                }

                clan.members = clan.members.filter(m => m !== currentUser.id);
                currentUser.clanId = null;
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                const user = data.users.find(u => u.id === currentUser.id);
                if (user) user.clanId = null;

                await saveData(data);
                await refreshData();
                showToast('✅ Вы вышли из клана', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // УПРАВЛЕНИЕ УЧАСТНИКАМИ
        // ============================================================
        async function kickMember(clanId, userId) {
            if (!confirm('Вы уверены, что хотите кикнуть этого игрока?')) return;

            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');

                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) {
                    return showToast('❌ Нет прав', 'error');
                }

                if (userId === clan.leaderId) {
                    return showToast('❌ Нельзя кикнуть лидера', 'error');
                }

                clan.members = clan.members.filter(id => id !== userId);

                const user = data.users.find(u => u.id === userId);
                if (user) {
                    user.clanId = null;
                }

                await saveData(data);
                await refreshData();
                showToast('✅ Игрок кикнут', 'success');
                viewClan(clanId);

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        async function transferLeadership(clanId, newLeaderId) {
            if (!confirm('Передать лидерство этому игроку?')) return;

            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');

                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) {
                    return showToast('❌ Нет прав', 'error');
                }

                const newLeader = data.users.find(u => u.id === newLeaderId);
                if (!newLeader) return showToast('❌ Пользователь не найден', 'error');

                const oldLeaderId = clan.leaderId;
                clan.leaderId = newLeaderId;

                const oldLeader = data.users.find(u => u.id === oldLeaderId);
                if (oldLeader && oldLeader.role === 'leader') {
                    oldLeader.role = 'member';
                }
                if (newLeader.role !== 'leader') {
                    newLeader.role = 'leader';
                }

                if (currentUser.id === newLeaderId) {
                    currentUser.role = 'leader';
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }

                await saveData(data);
                await refreshData();
                showToast(`✅ Лидерство передано игроку ${newLeader.name}`, 'success');
                viewClan(clanId);
                renderMainActionButton();

            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // АДМИН: ОЧИСТКА ВСЕХ ДАННЫХ
        // ============================================================
        async function clearAllData() {
            if (!isAdmin(currentUser)) return;
            if (!confirm('⚠️ Очистить все данные?')) return;

            try {
                const data = await loadData();
                data.users = [];
                data.clans = [];
                data.requests = [];
                await saveData(data);
                await refreshData();
                showToast('✅ Все данные очищены', 'success');
                location.reload();
            } catch (error) {
                showToast(`❌ ${error.message}`, 'error');
            }
        }

        // ============================================================
        // ВЫХОД ИЗ АККАУНТА
        // ============================================================
        async function logoutUser() {
            if (!confirm('🚪 Выйти из аккаунта? Ваши данные будут удалены из системы.')) return;

            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== currentUser.id);
                data.clans.forEach(clan => {
                    if (clan.members) {
                        clan.members = clan.members.filter(m => m !== currentUser.id);
                    }
                    if (clan.leaderId === currentUser.id) {
                        const newLeader = clan.members && clan.members.length > 0 ? clan.members[0] : null;
                        if (newLeader) {
                            const leaderUser = data.users.find(u => u.id === newLeader);
                            clan.leaderId = newLeader;
                            clan.leaderName = leaderUser ? leaderUser.name : 'Неизвестен';
                        } else {
                            data.clans = data.clans.filter(c => c.id !== clan.id);
                        }
                    }
                });
                await saveData(data);

                localStorage.removeItem('bsc_user');
                localStorage.removeItem('bsc_test_id');

                currentUser = null;
                allUsers = data.users;
                allClans = data.clans;
                allRequests = data.requests;

                showRegisterModal();
                updateUI();
                showTab('clans');
                renderMainActionButton();

                showToast('✅ Вы вышли из аккаунта. Все данные удалены.', 'success');

            } catch (error) {
                showToast(`❌ Ошибка при выходе: ${error.message}`, 'error');
            }
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        async function refreshData() {
            const data = await loadData();
            allUsers = data.users || [];
            allClans = data.clans || [];
            allRequests = data.requests || [];
            if (currentUser) {
                const updated = allUsers.find(u => u.id === currentUser.id);
                if (updated) {
                    currentUser = updated;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
            }
            updateUI();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function toggleProfile() {
            document.getElementById('profileDropdown').classList.toggle('show');
        }

        function clearMyClan() {
            currentUser.clanId = null;
            localStorage.setItem('bsc_user', JSON.stringify(currentUser));
            updateUI();
            showTab('myclan');
            renderMainActionButton();
        }

        document.addEventListener('click', function(e) {
            const wrap = document.querySelector('.profile-btn-wrap');
            if (wrap && !wrap.contains(e.target)) {
                document.getElementById('profileDropdown').classList.remove('show');
            }
        });

        // ============================================================
        // ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
