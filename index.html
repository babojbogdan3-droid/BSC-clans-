<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Clans</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121620;
            --card-bg: #1a2233;
            --accent: #3b82f6;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .view { display: none; }
        .view.active { display: block; }
        .clan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .clan-info h3 { margin: 0 0 6px 0; font-size: 16px; }
        .clan-info p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .back-btn {
            background: none; border: none; color: var(--accent);
            font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 12px;
        }
        input, textarea {
            width: 100%; box-sizing: border-box; background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: var(--text); padding: 10px; margin-bottom: 10px; font-size: 14px;
        }
        button.action-btn {
            width: 100%; background: var(--accent); color: white; border: none;
            border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <div id="main-view" class="view active">
        <h2 style="font-size: 18px; margin-bottom: 4px;">Кланы BSC</h2>
        <p id="tg-username" style="font-size: 13px; color: var(--text-muted); margin-top: 0;"></p>
        <p id="tg-id" style="font-size: 11px; color: var(--text-muted); display:none;"></p>

        <div id="my-clan-section" style="margin-bottom: 20px;"></div>

        <button class="action-btn" onclick="switchView('create-view')" style="margin-bottom: 16px;">Создать клан</button>
        
        <h3 style="font-size: 15px; margin-bottom: 10px;">Все кланы</h3>
        <div id="clans-container">
            <p style="text-align: center; color: var(--text-muted); font-size: 13px;">Загрузка...</p>
        </div>
    </div>

    <!-- Экран создания клана -->
    <div id="create-view" class="view">
        <button class="back-btn" onclick="switchView('main-view')">← Назад</button>
        <h2 style="font-size: 18px; margin-bottom: 12px;">Создание клана</h2>
        <form onsubmit="createClan(event)">
            <input type="text" id="clan-name" placeholder="Название клана" required maxlength="30">
            <textarea id="clan-desc" placeholder="Описание клана" rows="3" maxlength="150"></textarea>
            <button type="submit" class="action-btn">СОЗДАТЬ</button>
        </form>
    </div>

    <!-- Экран профиля -->
    <div id="profile-view" class="view">
        <button class="back-btn" onclick="switchView('main-view')">← Назад</button>
        <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--accent);">Профиль игрока</h2>
        <div id="profile-content" class="clan-card"></div>
    </div>

    <script>
        const JSON_BIN_ID = '6a69f615da38895dfe9fba09';
        const JSON_BIN_KEY = '$2a$10$ykxy38WFCVMPvywkDdXvPuovLJRzEYFxED2JkFVD6XnyZ3pRERQF';

        let tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); }

        let user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {
            first_name: "Игрок",
            id: Math.floor(Math.random() * 100000000),
            username: "user_" + Math.floor(Math.random() * 1000)
        };

        document.getElementById('tg-username').innerText = `Игрок: ${user.first_name}`;
        document.getElementById('tg-id').innerText = `${user.id}`;

        let myProfile = JSON.parse(localStorage.getItem('bsc_my_profile')) || {
            userId: user.id,
            name: user.first_name,
            clan: null
        };

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'main-view') {
                loadClans();
                renderMyClan();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function loadClans() {
            let container = document.getElementById('clans-container');
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${JSON_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSON_BIN_KEY }
                });
                let result = await response.json();
                let clans = result.record || [];
                renderClansList(clans);
            } catch (e) {
                container.innerHTML = '<p style="color:var(--danger); text-align:center; font-size:13px;">Ошибка соединения с сервером!</p>';
            }
        }

        function renderClansList(clans) {
            let container = document.getElementById('clans-container');
            if (clans.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-size:13px;">Кланов пока нет на сервере.</p>';
                return;
            }
            container.innerHTML = clans.map(c => `
                <div class="clan-card">
                    <div class="clan-info">
                        <h3>${escapeHtml(c.name)}</h3>
                        <p>${escapeHtml(c.desc || 'Нет описания')}</p>
                        <p style="font-size:11px; color:var(--accent); margin-top:6px;">Глава: @${escapeHtml(c.owner)} | Участников: ${c.members ? c.members.length : 1}</p>
                    </div>
                    ${myProfile.clan === c.id ? '<span style="color:var(--success); font-size:12px; display:block; margin-top:8px;">Вы в этом клане</span>' : ''}
                    ${myProfile.clan && myProfile.clan === c.id && c.ownerId == user.id ? `<button onclick="deleteClan('${c.id}')" style="background:var(--danger); color:white; border:none; border-radius:6px; padding:6px 10px; margin-top:8px; font-size:12px; cursor:pointer;">Распустить</button>` : ''}
                </div>
            `).join('');
        }

        async function createClan(e) {
            e.preventDefault();
            let name = document.getElementById('clan-name').value.trim();
            let desc = document.getElementById('clan-desc').value.trim();
            let btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Создание...';

            try {
                let getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSON_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSON_BIN_KEY }
                });
                let getResult = await getRes.json();
                let clans = getResult.record || [];

                let newClan = {
                    id: 'clan_' + Date.now(),
                    name: name,
                    desc: desc,
                    owner: user.username || user.first_name,
                    ownerId: user.id,
                    members: [user.id]
                };

                clans.push(newClan);

                let putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSON_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSON_BIN_KEY
                    },
                    body: JSON.stringify(clans)
                });

                if (!putRes.ok) throw new Error('Server error');

                myProfile.clan = newClan.id;
                localStorage.setItem('bsc_my_profile', JSON.stringify(myProfile));
                
                document.getElementById('clan-name').value = '';
                document.getElementById('clan-desc').value = '';
                switchView('main-view');
            } catch (err) {
                alert('Ошибка сохранения на сервер.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'СОЗДАТЬ';
            }
        }

        async function deleteClan(clanId) {
            if (!confirm("Точно распустить клан?")) return;
            try {
                let getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSON_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSON_BIN_KEY }
                });
                let getResult = await getRes.json();
                let clans = getResult.record || [];

                let updatedClans = clans.filter(c => c.id !== clanId);

                let putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSON_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSON_BIN_KEY
                    },
                    body: JSON.stringify(updatedClans)
                });

                if (!putRes.ok) throw new Error('Server error');

                if (myProfile.clan === clanId) {
                    myProfile.clan = null;
                    localStorage.setItem('bsc_my_profile', JSON.stringify(myProfile));
                }
                loadClans();
                renderMyClan();
            } catch (err) {
                alert('Ошибка при удалении.');
            }
        }

        function renderMyClan() {
            let section = document.getElementById('my-clan-section');
            if (!myProfile.clan) {
                section.innerHTML = `
                    <div class="clan-card" style="text-align: center; border: 1px dashed rgba(255,255,255,0.1);">
                        <p style="color:var(--text-muted); font-size:13px; margin:0;">Вы еще не состоите ни в одном клане.</p>
                    </div>`;
            } else {
                section.innerHTML = `
                    <div class="clan-card" style="border-left: 4px solid var(--accent);">
                        <h3 style="margin-bottom:4px;">Мой клан</h3>
                        <p style="font-size:13px; color:var(--text-muted);">Вы участник клана</p>
                        <button onclick="switchView('profile-view'); renderProfile();" class="action-btn" style="margin-top:10px; padding:8px; font-size:13px;">Управление кланом</button>
                    </div>`;
            }
        }

        function renderProfile() {
            let content = document.getElementById('profile-content');
            content.innerHTML = `
                <p style="margin: 0 0 10px 0; font-size:14px;"><strong>Игрок:</strong> ${escapeHtml(user.first_name)}</p>
                <p style="margin: 0 0 15px 0; font-size:14px;"><strong>Telegram ID:</strong> ${user.id}</p>
                <button onclick="leaveClan()" style="background:var(--danger); color:white; border:none; border-radius:8px; padding:10px; width:100%; font-weight:bold; cursor:pointer;">Покинуть клан</button>
            `;
        }

        function leaveClan() {
            myProfile.clan = null;
            localStorage.setItem('bsc_my_profile', JSON.stringify(myProfile));
            alert('Вы вышли из клана.');
            switchView('main-view');
        }

        loadClans();
        renderMyClan();
    </script>
</body>
</html>
