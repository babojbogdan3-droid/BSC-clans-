<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Strike Clans</title>
    <script src="https://telegram.org/js/telegram.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0a0e14;
            --card: #161b22;
            --border: #30363d;
            --text: #f0f6fc;
            --muted: #8b949e;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.2);
            --success: #2ea043;
            --danger: #f85149;
            --gold: #ffd700;
            --radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .profile-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .profile-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .profile-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            min-width: 200px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 200;
        }
        .profile-dropdown.show {
            display: block;
        }
        .profile-btn-wrap {
            position: relative;
        }
        .profile-dropdown .info {
            margin-bottom: 8px;
        }
        .profile-dropdown .info .name {
            font-weight: 600;
            font-size: 14px;
        }
        .profile-dropdown .info .detail {
            color: var(--muted);
            font-size: 12px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 17px;
            font-weight: 600;
        }
        .card-tag {
            color: var(--accent);
            font-weight: 700;
            font-size: 13px;
            background: rgba(0, 240, 255, 0.08);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }
        .card-sub {
            color: var(--muted);
            font-size: 13px;
            margin: 4px 0 8px 0;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #0a0e14;
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-gold {
            background: var(--gold);
            color: #0a0e14;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }
        .btn-block {
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
            margin-top: 10px;
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }
        .modal input:focus,
        .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal textarea {
            resize: vertical;
            min-height: 50px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }
        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--bg);
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 4px;
            border-left: 2px solid var(--accent);
        }
        .member-row .actions {
            display: flex;
            gap: 4px;
        }
        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .request-item:last-child {
            border-bottom: none;
        }
        .empty {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
        }
        .empty .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: var(--muted);
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
        }
        .menu {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .menu .btn {
            flex: 1;
            text-align: center;
            font-size: 12px;
            padding: 8px 4px;
        }
        @media (max-width: 480px) {
            .menu .btn {
                font-size: 11px;
                padding: 6px 2px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>⚔️ BSC Clans</h1>
            <div class="profile-btn-wrap">
                <button class="profile-btn" onclick="toggleProfile()" id="profileToggle">
                    👤
                    <span class="badge" id="notifBadge" style="display:none;">0</span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="info">
                        <div class="name" id="profName">Неизвестно</div>
                        <div class="detail" id="profGameId">ID: —</div>
                        <div class="detail" id="profClan">Клан: —</div>
                        <div class="detail" id="profRole">Роль: —</div>
                    </div>
                    <button class="btn btn-secondary btn-block btn-sm" onclick="openEditProfile()">✏️ Редактировать профиль</button>
                    <button class="btn btn-danger btn-block btn-sm" onclick="logoutUser()" style="margin-top:6px;">🚪 Выйти</button>
                </div>
            </div>
        </header>

        <div class="menu">
            <button class="btn btn-primary" onclick="showTab('clans')" id="tabClans">🔴 КЛАНЫ</button>
            <button class="btn btn-secondary" onclick="showTab('requests')" id="tabRequests">📩 ЗАЯВКИ</button>
            <button class="btn btn-secondary" onclick="showTab('myclan')" id="tabMyClan">⭐ МОЙ КЛАН</button>
            <button class="btn btn-secondary" onclick="showTab('admin')" id="tabAdmin" style="display:none;">🛡️ АДМИН</button>
        </div>

        <div id="content">
            <div class="loading"><div class="spinner"></div>Загрузка...</div>
        </div>

        <div id="mainActionButton" style="margin-top:10px;"></div>

        <footer class="footer">Создатель: @NoisyBoy141</footer>
    </div>

    <!-- МОДАЛКА РЕГИСТРАЦИИ -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <h2>📝 Добро пожаловать</h2>
            <label>Никнейм</label>
            <input type="text" id="regName" placeholder="s1m1" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="regTelegram" placeholder="NoisyBoy141" maxlength="32">
            <label>Игровой ID</label>
            <input type="text" id="regGameId" placeholder="22887924" maxlength="15">
            <label>Роль</label>
            <select id="regRole">
                <option value="member">Игрок</option>
                <option value="leader">Лидер</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="registerUser()">✅ Войти</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
    <div class="modal-overlay" id="editProfileModal">
        <div class="modal">
            <h2>✏️ Редактировать профиль</h2>
            <label>Никнейм</label>
            <input type="text" id="editProfName" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="editProfTelegram" maxlength="32">
            <label>Игровой ID</label>
            <input type="text" id="editProfGameId" maxlength="15">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editProfileModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СОЗДАНИЯ КЛАНА -->
    <div class="modal-overlay" id="createClanModal">
        <div class="modal">
            <h2>➕ Создать клан</h2>
            <label>Название</label>
            <input type="text" id="newClanName" maxlength="30">
            <label>Тег (2-6 символов)</label>
            <input type="text" id="newClanTag" maxlength="6" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="newClanDesc"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('createClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createClan()">Создать</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ КЛАНА -->
    <div class="modal-overlay" id="editClanModal">
        <div class="modal">
            <h2>✏️ Редактировать клан</h2>
            <label>Название</label>
            <input type="text" id="editClanName">
            <label>Тег</label>
            <input type="text" id="editClanTag" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="editClanDesc"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveEditClan()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПРОСМОТРА КЛАНА -->
    <div class="modal-overlay" id="clanDetailModal">
        <div class="modal">
            <h2 id="detailClanName">🏰 Клан</h2>
            <div id="detailClanInfo"></div>
            <div id="detailMembers"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('clanDetailModal')">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // НАСТРОЙКИ
        // ============================================================
        const JSONBIN_BIN_ID = '6a6b0926da38895dfea333a8';
        const JSONBIN_API_KEY = '$2a$10$ykxy38WFCVMPvywkDdXvPuovLJRzEYFxED2JkFVD6XnyZ3pRERQF.';
        const ADMIN_GAME_ID = '22887924';

        let currentUser = null;
        let allUsers = [];
        let allClans = [];
        let allRequests = [];
        let currentTab = 'clans';
        let editingClanId = null;

        // ============================================================
        // РАБОТА С JSONBin
        // ============================================================
        async function loadData() {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const json = await resp.json();
            return json.record || { users: [], clans: [], requests: [] };
        }

        async function saveData(data) {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(data)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.json();
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function isAdmin(user) {
            return user && user.gameId === ADMIN_GAME_ID;
        }

        function getUserName(id) {
            const u = allUsers.find(x => x.id === id);
            return u ? u.name : id;
        }

        function getClanLeader(clan) {
            return allUsers.find(u => u.id === clan.leaderId);
        }

        function showToast(text, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.className = 'toast show ' + type;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function initApp() {
            try {
                const data = await loadData();
                allUsers = data.users || [];
                allClans = data.clans || [];
                allRequests = data.requests || [];

                const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
                let tgId = tg ? tg.id.toString() : null;

                if (!tgId) {
                    let savedId = localStorage.getItem('bsc_test_id');
                    if (!savedId) {
                        savedId = 'test_' + Date.now();
                        localStorage.setItem('bsc_test_id', savedId);
                    }
                    tgId = savedId;
                }

                let user = allUsers.find(u => u.id === tgId);

                if (user) {
                    if (user.banned) {
                        document.getElementById('content').innerHTML = `
                            <div class="card" style="border-color:var(--danger);">
                                <div style="color:var(--danger);font-size:18px;">⛔ ДОСТУП ЗАПРЕЩЁН</div>
                                <div style="color:var(--muted);">Ваш аккаунт забанен.</div>
                            </div>
                        `;
                        return;
                    }
                    if (isAdmin(user) && user.role !== 'admin') {
                        user.role = 'admin';
                        const ud = await loadData();
                        const target = ud.users.find(u => u.id === user.id);
                        if (target) { target.role = 'admin';
                            await saveData(ud); }
                        allUsers = ud.users || [];
                    }
                    currentUser = user;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                } else {
                    document.getElementById('registerModal').classList.add('show');
                    return;
                }

                updateUI();
                showTab('clans');
                renderMainActionButton();

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `
                    <div class="card" style="border-color:var(--danger);">
                        <div style="color:var(--danger);">❌ Ошибка</div>
                        <div style="color:var(--muted);">${e.message}</div>
                        <button class="btn btn-primary" style="margin-top:10px;" onclick="initApp()">🔄 Обновить</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // РЕГИСТРАЦИЯ
        // ============================================================
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const tgName = document.getElementById('regTelegram').value.trim();
            const gameId = document.getElementById('regGameId').value.trim();
            const role = document.getElementById('regRole').value;

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!tgName) return showToast('❌ Введите Telegram', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ ID должен быть числом', 'error');

            const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
            let tgId = tg ? tg.id.toString() : localStorage.getItem('bsc_test_id');
            if (!tgId) {
                tgId = 'test_' + Date.now();
                localStorage.setItem('bsc_test_id', tgId);
            }

            if (allUsers.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                return showToast('❌ Ник занят', 'error');
            }

            const newUser = {
                id: tgId,
                name: name,
                telegramUsername: tgName.startsWith('@') ? tgName : '@' + tgName,
                gameId: gameId,
                role: gameId === ADMIN_GAME_ID ? 'admin' : role,
                clanId: null
            };

            allUsers.push(newUser);
            const data = await loadData();
            data.users = allUsers;
            await saveData(data);

            currentUser = newUser;
            localStorage.setItem('bsc_user', JSON.stringify(currentUser));
            document.getElementById('registerModal').classList.remove('show');
            showToast('✅ Добро пожаловать, ' + name, 'success');
            updateUI();
            showTab('clans');
            renderMainActionButton();
        }

        // ============================================================
        // ПРОФИЛЬ
        // ============================================================
        function openEditProfile() {
            if (!currentUser) return;
            document.getElementById('editProfName').value = currentUser.name || '';
            document.getElementById('editProfTelegram').value = (currentUser.telegramUsername || '').replace('@', '');
            document.getElementById('editProfGameId').value = currentUser.gameId || '';
            document.getElementById('editProfileModal').classList.add('show');
            document.getElementById('profileDropdown').classList.remove('show');
        }

        async function saveProfile() {
            const name = document.getElementById('editProfName').value.trim();
            const tgName = document.getElementById('editProfTelegram').value.trim();
            const gameId = document.getElementById('editProfGameId').value.trim();

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!tgName) return showToast('❌ Введите Telegram', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ ID должен быть числом', 'error');

            try {
                const data = await loadData();
                const user = data.users.find(u => u.id === currentUser.id);
                if (!user) return showToast('❌ Пользователь не найден', 'error');

                if (user.name.toLowerCase() !== name.toLowerCase() && data.users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                    return showToast('❌ Ник занят', 'error');
                }

                user.name = name;
                user.telegramUsername = tgName.startsWith('@') ? tgName : '@' + tgName;
                user.gameId = gameId;

                await saveData(data);
                await refreshData();
                closeModal('editProfileModal');
                showToast('✅ Профиль обновлён', 'success');
                updateUI();
                showTab(currentTab);
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // UI
        // ============================================================
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('profName').textContent = currentUser.name || 'Неизвестно';
            document.getElementById('profGameId').textContent = 'ID: ' + (currentUser.gameId || '—');
            const clan = allClans.find(c => c.id === currentUser.clanId);
            document.getElementById('profClan').textContent = 'Клан: ' + (clan ? clan.name : '—');
            document.getElementById('profRole').textContent = 'Роль: ' + (currentUser.role === 'admin' ? 'Админ' : currentUser.role === 'leader' ? 'Лидер' : 'Игрок');

            const adminTab = document.getElementById('tabAdmin');
            adminTab.style.display = isAdmin(currentUser) ? 'inline-block' : 'none';

            const pending = allRequests.filter(r => {
                const c = allClans.find(cl => cl.id === r.clanId);
                return c && c.leaderId === currentUser.id && r.status === 'pending';
            });
            const badge = document.getElementById('notifBadge');
            if (pending.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = pending.length;
            } else {
                badge.style.display = 'none';
            }
            renderMainActionButton();
        }

        function renderMainActionButton() {
            const el = document.getElementById('mainActionButton');
            if (!currentUser) { el.innerHTML = ''; return; }
            if (!currentUser.clanId) {
                el.innerHTML = `<button class="btn btn-primary btn-block" onclick="openCreateClan()">➕ СОЗДАТЬ КЛАН</button>`;
            } else {
                el.innerHTML = '';
            }
        }

        function showTab(tab) {
            currentTab = tab;
            ['tabClans', 'tabRequests', 'tabMyClan', 'tabAdmin'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.className = 'btn btn-secondary';
            });
            const map = { clans: 'tabClans', requests: 'tabRequests', myclan: 'tabMyClan', admin: 'tabAdmin' };
            const active = document.getElementById(map[tab]);
            if (active) active.className = 'btn btn-primary';

            const container = document.getElementById('content');
            const funcs = { clans: renderClans, requests: renderRequests, myclan: renderMyClan, admin: renderAdmin };
            if (funcs[tab]) funcs[tab](container);
            else container.innerHTML = '<div class="empty">Неизвестная вкладка</div>';
        }

        // ============================================================
        // РЕНДЕРЫ
        // ============================================================
        async function renderClans(container) {
            await refreshData();
            if (!allClans.length) {
                container.innerHTML = `<div class="empty"><span class="icon">📭</span><p>Нет кланов</p></div>`;
                return;
            }
            let html = '';
            allClans.forEach(clan => {
                const members = clan.members || [];
                const isLeader = clan.leaderId === currentUser.id;
                const isMember = members.includes(currentUser.id);
                const isAdminUser = isAdmin(currentUser);
                const leader = getClanLeader(clan);
                const showApply = !isMember && !isLeader && !currentUser.clanId;
                const showDelete = isLeader || isAdminUser;
                const showEdit = isLeader || isAdminUser;

                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${clan.name}</span>
                            <span class="card-tag">[${clan.tag}]</span>
                        </div>
                        <div class="card-sub">Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length}</div>
                        ${clan.description ? `<div style="color:var(--muted);font-size:13px;">${clan.description}</div>` : ''}
                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="viewClan('${clan.id}')">👁️ Просмотр</button>
                            ${showApply ? `<button class="btn btn-success btn-sm" onclick="applyToClan('${clan.id}')">📩 Вступить</button>` : ''}
                            ${showDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteClan('${clan.id}')">🗑 Распустить</button>` : ''}
                            ${showEdit ? `<button class="btn btn-primary btn-sm" onclick="openEditClan('${clan.id}')">✏️ Редактировать</button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function renderRequests(container) {
            await refreshData();
            const myClan = allClans.find(c => c.leaderId === currentUser.id);
            if (!myClan) {
                container.innerHTML = `<div class="empty"><span class="icon">📩</span><p>Вы не глава клана</p></div>`;
                return;
            }
            const pending = allRequests.filter(r => r.clanId === myClan.id && r.status === 'pending');
            if (!pending.length) {
                container.innerHTML = `<div class="empty"><span class="icon">✅</span><p>Нет заявок</p></div>`;
                return;
            }
            let html = `<div style="color:var(--muted);margin-bottom:8px;">📨 Заявки (${pending.length})</div>`;
            pending.forEach(req => {
                const user = allUsers.find(u => u.id === req.userId);
                html += `
                    <div class="request-item">
                        <div><div class="req-name">${user ? user.name : 'Игрок'}</div><div class="req-date">ID: ${req.userId}</div></div>
                        <div>
                            <button class="btn btn-success btn-sm" onclick="acceptRequest('${req.id}')">✅</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectRequest('${req.id}')">❌</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function renderMyClan(container) {
            await refreshData();
            if (!currentUser.clanId) {
                container.innerHTML = `<div class="empty"><span class="icon">⭐</span><p>Вы не в клане</p></div>`;
                return;
            }
            const clan = allClans.find(c => c.id === currentUser.clanId);
            if (!clan) {
                container.innerHTML = `<div class="empty"><span class="icon">⚠️</span><p>Клан удалён</p></div>`;
                return;
            }
            const members = clan.members || [];
            const isLeader = clan.leaderId === currentUser.id;
            const leader = getClanLeader(clan);
            let memHtml = '';
            members.forEach(mid => {
                const user = allUsers.find(u => u.id === mid);
                memHtml += `<div class="member-row"><span>${user ? user.name : mid}</span><span class="role-tag">${mid === clan.leaderId ? '👑 Глава' : 'Участник'}</span></div>`;
            });
            container.innerHTML = `
                <div class="card" style="border-color:var(--accent);">
                    <div class="card-header"><span class="card-title">${clan.name}</span><span class="card-tag">[${clan.tag}]</span></div>
                    <div class="card-sub">Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length}</div>
                    ${clan.description ? `<div style="color:var(--muted);font-size:13px;">${clan.description}</div>` : ''}
                    <div style="margin-top:8px;">${memHtml}</div>
                    <div class="card-actions">
                        ${isLeader ? `<button class="btn btn-danger btn-sm" onclick="deleteClan('${clan.id}')">🗑 Распустить</button>` : ''}
                        ${(isLeader || isAdmin(currentUser)) ? `<button class="btn btn-primary btn-sm" onclick="openEditClan('${clan.id}')">✏️ Редактировать</button>` : ''}
                    </div>
                </div>
            `;
        }

        async function renderAdmin(container) {
            if (!isAdmin(currentUser)) {
                container.innerHTML = `<div class="empty">⛔ Доступ запрещён</div>`;
                return;
            }
            await refreshData();
            let html = `
                <div class="card" style="border-color:var(--gold);">
                    <div style="display:flex;justify-content:space-between;">
                        <h3>🛡️ Админ-панель</h3>
                        <span style="color:var(--gold);font-size:12px;">Админ</span>
                    </div>
                    <div style="color:var(--muted);font-size:13px;">Кланов: ${allClans.length} | Пользователей: ${allUsers.length} | Заявок: ${allRequests.filter(r => r.status === 'pending').length}</div>
                    <button class="btn btn-danger btn-sm" onclick="clearAllData()" style="margin-top:8px;">⚠️ Очистить всё</button>
                </div>
            `;
            if (allUsers.length) {
                html += `<div style="margin-top:10px;"><h4>Пользователи</h4>`;
                allUsers.forEach(user => {
                    const isAdminUser = isAdmin(user);
                    const isBanned = user.banned === true;
                    html += `
                        <div class="card" style="border-color:${isAdminUser ? 'var(--gold)' : 'var(--border)'};">
                            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
                                <div><strong>${user.name}</strong> ${isAdminUser ? '👑' : ''} ${isBanned ? '🔨' : ''}<br><span style="color:var(--muted);font-size:12px;">Game ID: ${user.gameId}</span></div>
                                <div>
                                    ${!isAdminUser ? `
                                        <button class="btn btn-danger btn-sm" onclick="adminDeleteUser('${user.id}')">❌</button>
                                        ${isBanned ? `<button class="btn btn-success btn-sm" onclick="adminUnbanUser('${user.id}')">✅</button>` : `<button class="btn btn-danger btn-sm" onclick="adminBanUser('${user.id}')">🔨</button>`}
                                    ` : `<span style="color:var(--gold);font-size:12px;">👑 Админ</span>`}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // ============================================================
        // ДЕЙСТВИЯ С КЛАНАМИ
        // ============================================================
        function openCreateClan() {
            if (currentUser.clanId) return showToast('❌ Вы уже в клане', 'error');
            document.getElementById('newClanName').value = '';
            document.getElementById('newClanTag').value = '';
            document.getElementById('newClanDesc').value = '';
            document.getElementById('createClanModal').classList.add('show');
        }

        async function createClan() {
            const name = document.getElementById('newClanName').value.trim();
            const tag = document.getElementById('newClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('newClanDesc').value.trim();
            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                if (data.clans.find(c => c.name.toLowerCase() === name.toLowerCase())) return showToast('❌ Клан существует', 'error');

                const newClan = {
                    id: 'clan_' + Date.now(),
                    name,
                    tag,
                    leaderId: currentUser.id,
                    members: [currentUser.id],
                    description: desc,
                    created: new Date().toISOString()
                };
                data.clans.push(newClan);
                await saveData(data);
                currentUser.clanId = newClan.id;
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                await refreshData();
                closeModal('createClanModal');
                showToast('✅ Клан создан!', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        function openEditClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
            editingClanId = clanId;
            document.getElementById('editClanName').value = clan.name;
            document.getElementById('editClanTag').value = clan.tag;
            document.getElementById('editClanDesc').value = clan.description || '';
            document.getElementById('editClanModal').classList.add('show');
        }

        async function saveEditClan() {
            const name = document.getElementById('editClanName').value.trim();
            const tag = document.getElementById('editClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('editClanDesc').value.trim();
            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === editingClanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                clan.name = name;
                clan.tag = tag;
                clan.description = desc;
                await saveData(data);
                await refreshData();
                closeModal('editClanModal');
                showToast('✅ Клан обновлён', 'success');
                showTab(currentTab);
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function viewClan(clanId) {
            await refreshData();
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');

            const members = clan.members || [];
            const leader = getClanLeader(clan);
            const isLeader = clan.leaderId === currentUser.id;
            const isAdminUser = isAdmin(currentUser);
            const canManage = isLeader || isAdminUser;

            document.getElementById('detailClanName').textContent = `🏰 ${clan.name} [${clan.tag}]`;
            document.getElementById('detailClanInfo').innerHTML = `
                <div style="color:var(--muted);font-size:14px;">Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length}</div>
                ${clan.description ? `<div style="color:var(--muted);font-size:13px;">${clan.description}</div>` : ''}
            `;

            let memHtml = '';
            members.forEach(mid => {
                const user = allUsers.find(u => u.id === mid);
                const isLeaderUser = mid === clan.leaderId;
                const isCurrentUser = mid === currentUser.id;
                let actions = '';
                if (canManage && !isLeaderUser && mid !== currentUser.id) {
                    actions = `<button class="btn btn-danger btn-sm" onclick="kickMember('${clan.id}','${mid}')">Кикнуть</button>
                               <button class="btn btn-gold btn-sm" onclick="transferLeadership('${clan.id}','${mid}')">👑 Назначить</button>`;
                }
                if (isCurrentUser && !isLeaderUser) {
                    actions += `<button class="btn btn-danger btn-sm" onclick="confirmLeaveFromView('${clan.id}')">🚪 Покинуть</button>`;
                }
                memHtml += `<div class="member-row"><span>${user ? user.name : mid} ${isLeaderUser ? '👑' : ''}</span><div>${actions}</div></div>`;
            });
            document.getElementById('detailMembers').innerHTML = memHtml || '<div style="color:var(--muted);">Нет участников</div>';
            document.getElementById('clanDetailModal').classList.add('show');
        }

        function confirmLeaveFromView(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (confirm(`Выйти из клана "${clan.name}"?`)) {
                leaveClan(clanId);
                closeModal('clanDetailModal');
            }
        }

        async function applyToClan(clanId) {
            if (currentUser.clanId) return showToast('❌ Вы уже в клане', 'error');
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (allRequests.find(r => r.clanId === clanId && r.userId === currentUser.id && r.status === 'pending')) {
                return showToast('⏳ Заявка уже отправлена', 'info');
            }
            if (!confirm(`Подать заявку в "${clan.name}"?`)) return;
            try {
                const data = await loadData();
                data.requests.push({
                    id: 'req_' + Date.now(),
                    clanId,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    status: 'pending',
                    created: new Date().toISOString()
                });
                await saveData(data);
                await refreshData();
                showToast('✅ Заявка отправлена', 'success');
                showTab('clans');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function acceptRequest(reqId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === reqId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');
                const clan = data.clans.find(c => c.id === req.clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (!clan.members) clan.members = [];
                if (!clan.members.includes(req.userId)) clan.members.push(req.userId);
                req.status = 'accepted';
                const user = data.users.find(u => u.id === req.userId);
                if (user) user.clanId = clan.id;
                await saveData(data);
                await refreshData();
                showToast('✅ Заявка принята', 'success');
                showTab('requests');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function rejectRequest(reqId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === reqId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');
                req.status = 'rejected';
                await saveData(data);
                await refreshData();
                showToast('❌ Заявка отклонена', 'error');
                showTab('requests');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function deleteClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
            if (!confirm(`Удалить клан "${clan.name}"?`)) return;

            try {
                const data = await loadData();
                data.clans = data.clans.filter(c => c.id !== clanId);
                data.requests = data.requests.filter(r => r.clanId !== clanId);
                data.users.forEach(u => { if (u.clanId === clanId) u.clanId = null; });
                if (currentUser.clanId === clanId) {
                    currentUser.clanId = null;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
                await saveData(data);
                await refreshData();
                showToast('✅ Клан удалён', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function leaveClan(clanId) {
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId === currentUser.id) return showToast('❌ Вы глава, сначала передайте лидерство', 'error');
                clan.members = clan.members.filter(m => m !== currentUser.id);
                currentUser.clanId = null;
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                const user = data.users.find(u => u.id === currentUser.id);
                if (user) user.clanId = null;
                await saveData(data);
                await refreshData();
                showToast('✅ Вы вышли из клана', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function kickMember(clanId, userId) {
            if (!confirm('Кикнуть игрока?')) return;
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
                if (userId === clan.leaderId) return showToast('❌ Нельзя кикнуть лидера', 'error');
                clan.members = clan.members.filter(id => id !== userId);
                const user = data.users.find(u => u.id === userId);
                if (user) user.clanId = null;
                await saveData(data);
                await refreshData();
                showToast('✅ Игрок кикнут', 'success');
                viewClan(clanId);
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function transferLeadership(clanId, newLeaderId) {
            if (!confirm('Передать лидерство?')) return;
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
                const newLeader = data.users.find(u => u.id === newLeaderId);
                if (!newLeader) return showToast('❌ Пользователь не найден', 'error');
                const oldLeaderId = clan.leaderId;
                clan.leaderId = newLeaderId;
                const oldLeader = data.users.find(u => u.id === oldLeaderId);
                if (oldLeader && oldLeader.role === 'leader') oldLeader.role = 'member';
                if (newLeader.role !== 'leader') newLeader.role = 'leader';
                if (currentUser.id === newLeaderId) {
                    currentUser.role = 'leader';
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
                await saveData(data);
                await refreshData();
                showToast(`✅ Лидерство передано ${newLeader.name}`, 'success');
                viewClan(clanId);
                renderMainActionButton();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // АДМИН ФУНКЦИИ
        // ============================================================
        async function adminDeleteUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя удалить админа', 'error');
            if (!confirm(`Удалить пользователя "${user.name}"?`)) return;

            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== userId);
                data.clans.forEach(c => { if (c.members) c.members = c.members.filter(m => m !== userId); if (c.leaderId === userId) { const newL = c.members && c.members.length ? c.members[0] : null;
                        if (newL) { const lu = data.users.find(u => u.id === newL);
                            c.leaderId = newL;
                            c.leaderName = lu ? lu.name : 'Неизвестен'; } else { data.clans = data.clans.filter(cl => cl.id !== c.id); } } });
                data.requests = data.requests.filter(r => r.userId !== userId);
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} удалён`, 'success');
                showTab('admin');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function adminBanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя забанить админа', 'error');
            if (!confirm(`Забанить "${user.name}"?`)) return;
            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) target.banned = true;
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} забанен`, 'success');
                showTab('admin');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function adminUnbanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (!confirm(`Разбанить "${user.name}"?`)) return;
            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) target.banned = false;
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} разбанен`, 'success');
                showTab('admin');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function clearAllData() {
            if (!isAdmin(currentUser)) return;
            if (!confirm('⚠️ Очистить всё?')) return;
            try {
                const data = await loadData();
                data.users = [];
                data.clans = [];
                data.requests = [];
                await saveData(data);
                await refreshData();
                showToast('✅ Очищено', 'success');
                location.reload();
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        async function refreshData() {
            const data = await loadData();
            allUsers = data.users || [];
            allClans = data.clans || [];
            allRequests = data.requests || [];
            if (currentUser) {
                const updated = allUsers.find(u => u.id === currentUser.id);
                if (updated) {
                    currentUser = updated;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
            }
            updateUI();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function toggleProfile() {
            const dd = document.getElementById('profileDropdown');
            dd.classList.toggle('show');
        }

        // ============================================================
        // ВЫХОД
        // ============================================================
        async function logoutUser() {
            if (!confirm('Выйти из аккаунта?')) return;
            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== currentUser.id);
                data.clans.forEach(c => { if (c.members) c.members = c.members.filter(m => m !== currentUser.id); if (c.leaderId === currentUser.id) { const nl = c.members && c.members.length ? c.members[0] : null; if (nl) { const lu = data.users.find(u => u.id === nl);
                            c.leaderId = nl;
                            c.leaderName = lu ? lu.name : 'Неизвестен'; } else { data.clans = data.clans.filter(cl => cl.id !== c.id); } } });
                await saveData(data);
                localStorage.removeItem('bsc_user');
                localStorage.removeItem('bsc_test_id');
                currentUser = null;
                allUsers = data.users;
                allClans = data.clans;
                allRequests = data.requests;
                document.getElementById('registerModal').classList.add('show');
                updateUI();
                showTab('clans');
                renderMainActionButton();
                showToast('✅ Вы вышли', 'success');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
