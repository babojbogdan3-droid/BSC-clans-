<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC</title>
    <script src="https://telegram.org/js/telegram.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           СТИЛИ (те же, что были, добавил для рейтинга)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0b0e17;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-secondary: #8899bb;
            --accent: #5b8def;
            --accent-glow: rgba(91, 141, 239, 0.25);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, rgba(91, 141, 239, 0.06) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(91, 141, 239, 0.04) 0%, transparent 50%);
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .profile-btn-wrap {
            position: relative;
            z-index: 999;
        }
        .profile-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .profile-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
        }
        .profile-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff3d71;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
        }
        .profile-dropdown {
            position: absolute;
            top: 54px;
            right: 0;
            background: rgba(18, 24, 40, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 16px;
            min-width: 200px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 1000;
            animation: fadeSlide 0.2s ease;
        }
        .profile-dropdown.show { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-dropdown .info { margin-bottom: 12px; }
        .profile-dropdown .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .profile-dropdown .info .detail {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 2px;
        }

        .menu {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .menu .btn {
            flex: 1;
            padding: 10px 4px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .menu .btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .menu .btn-primary {
            background: rgba(91, 141, 239, 0.12);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .menu .btn-primary:hover {
            background: rgba(91, 141, 239, 0.2);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: all 0.25s;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card:hover {
            border-color: rgba(91, 141, 239, 0.2);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
        }
        .card-tag {
            font-weight: 700;
            font-size: 13px;
            color: var(--accent);
            background: rgba(91, 141, 239, 0.1);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(91, 141, 239, 0.15);
        }
        .card-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 4px 0 8px 0;
        }
        .card-sub .badge-online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 6px;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 28px var(--accent-glow);
        }
        .btn-success {
            background: #2ecc71;
            color: #fff;
            border: none;
        }
        .btn-success:hover {
            background: #27ae60;
        }
        .btn-danger {
            background: #ff3d71;
            color: #fff;
            border: none;
        }
        .btn-danger:hover {
            background: #e62e5c;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .btn-gold {
            background: #f1c40f;
            color: #0b0e17;
            border: none;
        }
        .btn-gold:hover {
            background: #f39c12;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 12px;
            font-size: 15px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1001;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: rgba(18, 24, 40, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            transition: border 0.2s;
        }
        .modal input:focus,
        .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.1);
        }
        .modal textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .modal-actions .btn { flex: 1; justify-content: center; }

        /* УЧАСТНИКИ */
        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent);
        }
        .member-row .role-tag {
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 10px;
            border-radius: 12px;
        }
        .member-row .actions { display: flex; gap: 4px; }

        /* ЗАЯВКИ */
        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .request-item:last-child { border-bottom: none; }
        .request-item .req-name { font-weight: 500; }
        .request-item .req-date { color: var(--text-secondary); font-size: 12px; }

        /* РЕЙТИНГ (таблица) */
        .rating-table {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rating-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 14px;
        }
        .rating-row .place {
            font-weight: 700;
            font-size: 16px;
            min-width: 32px;
        }
        .rating-row .place.gold { color: #f1c40f; }
        .rating-row .place.silver { color: #bdc3c7; }
        .rating-row .place.bronze { color: #e67e22; }
        .rating-row .clan-info {
            flex: 1;
            margin-left: 12px;
        }
        .rating-row .clan-info .name {
            font-weight: 600;
        }
        .rating-row .clan-info .tag {
            color: var(--text-secondary);
            font-size: 12px;
        }
        .rating-row .elo {
            font-weight: 700;
            color: var(--accent);
        }

        /* ПУСТЫЕ СОСТОЯНИЯ */
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty .icon { font-size: 48px; display: block; margin-bottom: 12px; }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 24, 40, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 2000;
            display: none;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            color: var(--text-primary);
            animation: fadeUp 0.3s ease;
        }
        .toast.show { display: block; }
        .toast.success { border-color: #2ecc71; }
        .toast.error { border-color: #ff3d71; }
        .toast.info { border-color: var(--accent); }

        /* ФУТЕР */
        .footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .footer-brand {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .footer-stats {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .footer-status {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .footer-status .online { color: #2ecc71; }
        .footer-links {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #fff; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 28px; }
            .menu .btn { font-size: 11px; padding: 8px 2px; }
            .modal { padding: 16px; }
            .footer-top { flex-direction: column; align-items: flex-start; }
            .footer-status { text-align: left; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1>BSC</h1>
            <div class="profile-btn-wrap">
                <button class="profile-btn" onclick="toggleProfile()" id="profileToggle">
                    👤
                    <span class="badge" id="notifBadge" style="display:none;">0</span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="info">
                        <div class="name" id="profName">Неизвестно</div>
                        <div class="detail" id="profGameId">ID: —</div>
                        <div class="detail" id="profClan">Клан: —</div>
                        <div class="detail" id="profRole">Роль: —</div>
                    </div>
                    <button class="btn btn-secondary btn-block btn-sm" onclick="openEditProfile()">✏️ Редактировать профиль</button>
                    <button class="btn btn-danger btn-block btn-sm" onclick="logoutUser()" style="margin-top:8px;">🚪 Выйти</button>
                </div>
            </div>
        </header>

        <!-- MENU -->
        <div class="menu">
            <button class="btn btn-primary" onclick="showTab('clans')" id="tabClans">🔴 КЛАНЫ</button>
            <button class="btn" onclick="showTab('requests')" id="tabRequests">📩 ЗАЯВКИ</button>
            <button class="btn" onclick="showTab('myclan')" id="tabMyClan">⭐ МОЙ КЛАН</button>
            <button class="btn" onclick="showTab('rating')" id="tabRating">🏆 РЕЙТИНГ</button>
            <button class="btn" onclick="showTab('admin')" id="tabAdmin" style="display:none;">🛡️ АДМИН</button>
        </div>

        <!-- CONTENT -->
        <div id="content">
            <div class="loading"><div class="spinner"></div>Загрузка...</div>
        </div>

        <!-- MAIN ACTION -->
        <div id="mainActionButton" style="margin-top:12px;"></div>

        <!-- FOOTER -->
        <footer class="footer" id="mainFooter">
            <div class="footer-top">
                <div>
                    <div class="footer-brand">⚡ BSC Clans</div>
                    <div class="footer-stats">
                        👥 Кланов: <span id="totalClans">0</span> •
                        👤 Участников: <span id="totalMembers">0</span>
                    </div>
                </div>
                <div class="footer-status">
                    <div><span class="online">●</span> Бот активен</div>
                    <div>v2.0 • 2026</div>
                </div>
            </div>
            <div class="footer-links">
                <span>Создатель: @NoisyBoy141</span>
                <a href="https://t.me/TheChannelBSC" target="_blank">📢 Канал</a>
                <a href="https://t.me/+5WdmSbxSUHsyYmMy" target="_blank">💬 Чат</a>
            </div>
        </footer>
    </div>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <h2>📝 Добро пожаловать</h2>
            <label>Никнейм</label>
            <input type="text" id="regName" placeholder="s1m1" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="regTelegram" placeholder="NoisyBoy141" maxlength="32">
            <label>Игровой ID</label>
            <input type="text" id="regGameId" placeholder="22887924" maxlength="15">
            <label>Роль</label>
            <select id="regRole">
                <option value="member">Игрок</option>
                <option value="leader">Лидер</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="registerUser()">✅ Войти</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editProfileModal">
        <div class="modal">
            <h2>✏️ Редактировать профиль</h2>
            <label>Никнейм</label>
            <input type="text" id="editProfName" maxlength="20">
            <label>Telegram username (без @)</label>
            <input type="text" id="editProfTelegram" maxlength="32">
            <label>Игровой ID</label>
            <input type="text" id="editProfGameId" maxlength="15">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editProfileModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createClanModal">
        <div class="modal">
            <h2>➕ Создать клан</h2>
            <label>Название</label>
            <input type="text" id="newClanName" maxlength="30">
            <label>Тег (2-6 символов)</label>
            <input type="text" id="newClanTag" maxlength="6" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="newClanDesc"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('createClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createClan()">Создать</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editClanModal">
        <div class="modal">
            <h2>✏️ Редактировать клан</h2>
            <label>Название</label>
            <input type="text" id="editClanName">
            <label>Тег</label>
            <input type="text" id="editClanTag" style="text-transform:uppercase;">
            <label>Описание</label>
            <textarea id="editClanDesc"></textarea>
            <label>Связь (Telegram владельца, без @)</label>
            <input type="text" id="editClanContact" placeholder="noisyboy141">
            <label>Канал (ссылка или юзернейм)</label>
            <input type="text" id="editClanChannel" placeholder="@bsc_channel или https://t.me/...">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('editClanModal')">Отмена</button>
                <button class="btn btn-primary" onclick="saveEditClan()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="clanDetailModal">
        <div class="modal">
            <h2 id="detailClanName">🏰 Клан</h2>
            <div id="detailClanInfo"></div>
            <div id="detailMembers"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('clanDetailModal')">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // НАСТРОЙКИ
        // ============================================================
        const JSONBIN_BIN_ID = '6a6b0926da38895dfea333a8';
        const JSONBIN_API_KEY = '$2a$10$ykxy38WFCVMPvywkDdXvPuovLJRzEYFxED2JkFVD6XnyZ3pRERQF.';
        const ADMIN_GAME_ID = '22887924';
        const BREWPAGE_URL = 'https://brewpage.app/public/TDg5l8lmFi'; // Твоя ссылка

        let currentUser = null;
        let allUsers = [];
        let allClans = [];
        let allRequests = [];
        let ratings = []; // рейтинг из BrewPage
        let currentTab = 'clans';
        let editingClanId = null;

        // ============================================================
        // РАБОТА С JSONBin
        // ============================================================
        async function loadData() {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const json = await resp.json();
            return json.record || { users: [], clans: [], requests: [] };
        }

        async function saveData(data) {
            const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(data)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.json();
        }

        // ============================================================
        // РАБОТА С BREWPAGE (рейтинг)
        // ============================================================
        async function loadRatings() {
            try {
                const resp = await fetch(BREWPAGE_URL);
                if (!resp.ok) throw new Error('Ошибка загрузки рейтинга');
                const data = await resp.json();
                ratings = data.clans || [];
                return ratings;
            } catch (e) {
                console.error('BrewPage error:', e);
                ratings = [];
                return [];
            }
        }

        async function updateRatingOnBrewPage(clanId, newElo) {
            try {
                // Загружаем текущий рейтинг
                const resp = await fetch(BREWPAGE_URL);
                const data = await resp.json();
                if (!data.clans) data.clans = [];

                // Ищем клан
                const clan = data.clans.find(c => c.id === clanId);
                if (clan) {
                    clan.elo = newElo;
                } else {
                    // Если клана нет — добавляем (но в теории он уже должен быть)
                    const clanFromMain = allClans.find(c => c.id === clanId);
                    if (clanFromMain) {
                        data.clans.push({
                            id: clanId,
                            name: clanFromMain.name,
                            tag: clanFromMain.tag,
                            elo: newElo
                        });
                    } else {
                        showToast('❌ Клан не найден', 'error');
                        return;
                    }
                }

                // Сохраняем обратно в BrewPage (через PUT)
                // К сожалению, BrewPage не поддерживает PUT напрямую.
                // Придётся использовать публикацию через форму или обновлять вручную.
                // ВРЕМЕННОЕ РЕШЕНИЕ: показываем инструкцию
                showToast('⚠️ Изменение рейтинга в BrewPage требует ручного обновления файла. Покажи это админу.', 'info');
                console.log('Новый рейтинг для', clanId, ':', newElo);

                // В будущем можно будет использовать BrewPage API, если появится.

            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function isAdmin(user) {
            return user && user.gameId === ADMIN_GAME_ID;
        }

        function getUserName(id) {
            const u = allUsers.find(x => x.id === id);
            return u ? u.name : id;
        }

        function getClanLeader(clan) {
            return allUsers.find(u => u.id === clan.leaderId);
        }

        function getClanElo(clanId) {
            const r = ratings.find(x => x.id === clanId);
            return r ? r.elo : 0;
        }

        function showToast(text, type = 'info') {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.className = 'toast show ' + type;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function updateFooterStats() {
            const totalClans = allClans.length;
            const totalMembers = allClans.reduce((sum, c) => sum + (c.members || []).length, 0);
            document.getElementById('totalClans').textContent = totalClans;
            document.getElementById('totalMembers').textContent = totalMembers;
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        async function initApp() {
            try {
                const data = await loadData();
                allUsers = data.users || [];
                allClans = data.clans || [];
                allRequests = data.requests || [];
                await loadRatings();
                updateFooterStats();

                const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
                let tgId = tg ? tg.id.toString() : null;

                if (!tgId) {
                    let savedId = localStorage.getItem('bsc_test_id');
                    if (!savedId) {
                        savedId = 'test_' + Date.now();
                        localStorage.setItem('bsc_test_id', savedId);
                    }
                    tgId = savedId;
                }

                let user = allUsers.find(u => u.id === tgId);

                if (user) {
                    if (user.banned) {
                        document.getElementById('content').innerHTML = `
                            <div class="card" style="border-color:#ff3d71;">
                                <div style="color:#ff3d71;font-size:18px;">⛔ ДОСТУП ЗАПРЕЩЁН</div>
                                <div style="color:var(--text-secondary);">Ваш аккаунт забанен.</div>
                            </div>
                        `;
                        return;
                    }
                    if (isAdmin(user) && user.role !== 'admin') {
                        user.role = 'admin';
                        const ud = await loadData();
                        const target = ud.users.find(u => u.id === user.id);
                        if (target) { target.role = 'admin';
                            await saveData(ud); }
                        allUsers = ud.users || [];
                        updateFooterStats();
                    }

                    if (user.role === 'leader' && !user.clanId) {
                        const myClan = allClans.find(c => c.leaderId === user.id);
                        if (myClan) {
                            user.clanId = myClan.id;
                            const upd = await loadData();
                            const uu = upd.users.find(u => u.id === user.id);
                            if (uu) { uu.clanId = myClan.id;
                                await saveData(upd); }
                            allUsers = upd.users || [];
                            updateFooterStats();
                        }
                    }

                    currentUser = user;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                } else {
                    document.getElementById('registerModal').classList.add('show');
                    return;
                }

                updateUI();
                showTab('clans');
                renderMainActionButton();
                updateFooterStats();

            } catch (e) {
                console.error(e);
                document.getElementById('content').innerHTML = `
                    <div class="card" style="border-color:#ff3d71;">
                        <div style="color:#ff3d71;">❌ Ошибка</div>
                        <div style="color:var(--text-secondary);">${e.message}</div>
                        <button class="btn btn-primary" style="margin-top:10px;" onclick="initApp()">🔄 Обновить</button>
                    </div>
                `;
            }
        }

        // ============================================================
        // РЕГИСТРАЦИЯ
        // ============================================================
        async function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const tgName = document.getElementById('regTelegram').value.trim();
            const gameId = document.getElementById('regGameId').value.trim();
            const role = document.getElementById('regRole').value;

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!tgName) return showToast('❌ Введите Telegram', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ ID должен быть числом', 'error');

            const tg = window.Telegram?.WebApp?.initDataUnsafe?.user;
            let tgId = tg ? tg.id.toString() : localStorage.getItem('bsc_test_id');
            if (!tgId) {
                tgId = 'test_' + Date.now();
                localStorage.setItem('bsc_test_id', tgId);
            }

            if (allUsers.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                return showToast('❌ Ник занят', 'error');
            }

            const newUser = {
                id: tgId,
                name: name,
                telegramUsername: tgName.startsWith('@') ? tgName : '@' + tgName,
                gameId: gameId,
                role: gameId === ADMIN_GAME_ID ? 'admin' : role,
                clanId: null
            };

            allUsers.push(newUser);
            const data = await loadData();
            data.users = allUsers;
            await saveData(data);

            currentUser = newUser;
            localStorage.setItem('bsc_user', JSON.stringify(currentUser));
            document.getElementById('registerModal').classList.remove('show');
            showToast('✅ Добро пожаловать, ' + name, 'success');
            updateUI();
            showTab('clans');
            renderMainActionButton();
            updateFooterStats();
        }

        // ============================================================
        // ПРОФИЛЬ
        // ============================================================
        function openEditProfile() {
            if (!currentUser) return;
            document.getElementById('editProfName').value = currentUser.name || '';
            document.getElementById('editProfTelegram').value = (currentUser.telegramUsername || '').replace('@', '');
            document.getElementById('editProfGameId').value = currentUser.gameId || '';
            document.getElementById('editProfileModal').classList.add('show');
            document.getElementById('profileDropdown').classList.remove('show');
        }

        async function saveProfile() {
            const name = document.getElementById('editProfName').value.trim();
            const tgName = document.getElementById('editProfTelegram').value.trim();
            const gameId = document.getElementById('editProfGameId').value.trim();

            if (!name) return showToast('❌ Введите никнейм', 'error');
            if (!tgName) return showToast('❌ Введите Telegram', 'error');
            if (!gameId) return showToast('❌ Введите игровой ID', 'error');
            if (isNaN(gameId)) return showToast('❌ ID должен быть числом', 'error');

            try {
                const data = await loadData();
                const user = data.users.find(u => u.id === currentUser.id);
                if (!user) return showToast('❌ Пользователь не найден', 'error');

                if (user.name.toLowerCase() !== name.toLowerCase() && data.users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                    return showToast('❌ Ник занят', 'error');
                }

                user.name = name;
                user.telegramUsername = tgName.startsWith('@') ? tgName : '@' + tgName;
                user.gameId = gameId;

                await saveData(data);
                await refreshData();
                closeModal('editProfileModal');
                showToast('✅ Профиль обновлён', 'success');
                updateUI();
                showTab(currentTab);
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // UI
        // ============================================================
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('profName').textContent = currentUser.name || 'Неизвестно';
            document.getElementById('profGameId').textContent = 'ID: ' + (currentUser.gameId || '—');
            const clan = allClans.find(c => c.id === currentUser.clanId);
            document.getElementById('profClan').textContent = 'Клан: ' + (clan ? clan.name : '—');
            document.getElementById('profRole').textContent = 'Роль: ' + (currentUser.role === 'admin' ? 'Админ' : currentUser.role === 'leader' ? 'Лидер' : 'Игрок');

            const adminTab = document.getElementById('tabAdmin');
            adminTab.style.display = isAdmin(currentUser) ? 'inline-block' : 'none';

            const pending = allRequests.filter(r => {
                const c = allClans.find(cl => cl.id === r.clanId);
                return c && c.leaderId === currentUser.id && r.status === 'pending';
            });
            const badge = document.getElementById('notifBadge');
            if (pending.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = pending.length;
            } else {
                badge.style.display = 'none';
            }
            renderMainActionButton();
            updateFooterStats();
        }

        function renderMainActionButton() {
            const el = document.getElementById('mainActionButton');
            if (!currentUser) { el.innerHTML = ''; return; }
            if (!currentUser.clanId) {
                el.innerHTML = `<button class="btn btn-primary btn-block" onclick="openCreateClan()">➕ СОЗДАТЬ КЛАН</button>`;
            } else {
                el.innerHTML = '';
            }
        }

        // ============================================================
        // ВКЛАДКИ
        // ============================================================
        function showTab(tab) {
            currentTab = tab;
            ['tabClans', 'tabRequests', 'tabMyClan', 'tabRating', 'tabAdmin'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.className = 'btn';
            });
            const map = {
                clans: 'tabClans',
                requests: 'tabRequests',
                myclan: 'tabMyClan',
                rating: 'tabRating',
                admin: 'tabAdmin'
            };
            const active = document.getElementById(map[tab]);
            if (active) active.className = 'btn btn-primary';

            const container = document.getElementById('content');
            const funcs = {
                clans: renderClans,
                requests: renderRequests,
                myclan: renderMyClan,
                rating: renderRating,
                admin: renderAdmin
            };
            if (funcs[tab]) funcs[tab](container);
            else container.innerHTML = '<div class="empty">Неизвестная вкладка</div>';
        }

        // ============================================================
        // РЕНДЕР КЛАНОВ (с рейтингом)
        // ============================================================
        async function renderClans(container) {
            await refreshData();
            if (!allClans.length) {
                container.innerHTML = `<div class="empty"><span class="icon">📭</span><p>Нет кланов</p></div>`;
                return;
            }
            let html = '';
            allClans.forEach(clan => {
                const members = clan.members || [];
                const isLeader = clan.leaderId === currentUser.id;
                const isMember = members.includes(currentUser.id);
                const isAdminUser = isAdmin(currentUser);
                const leader = getClanLeader(clan);
                const showApply = !isMember && !isLeader && !currentUser.clanId;
                const showDelete = isLeader || isAdminUser;
                const showEdit = isLeader || isAdminUser;
                const elo = getClanElo(clan.id);

                let extra = '';
                if (clan.contact) extra += `<div style="color:var(--text-secondary);font-size:13px;">📱 Связь: @${clan.contact}</div>`;
                if (clan.channel) extra += `<div style="color:var(--text-secondary);font-size:13px;">📢 Канал: ${clan.channel}</div>`;

                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${clan.name}</span>
                            <span class="card-tag">[${clan.tag}]</span>
                        </div>
                        <div class="card-sub">
                            <span class="badge-online"></span> Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length} • ⭐ ${elo} elo
                        </div>
                        ${clan.description ? `<div style="color:var(--text-secondary);font-size:13px;margin-bottom:4px;">${clan.description}</div>` : ''}
                        ${extra}
                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm" onclick="viewClan('${clan.id}')">👁️ Просмотр</button>
                            ${showApply ? `<button class="btn btn-success btn-sm" onclick="applyToClan('${clan.id}')">📩 Вступить</button>` : ''}
                            ${showDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteClan('${clan.id}')">🗑 Распустить</button>` : ''}
                            ${showEdit ? `<button class="btn btn-primary btn-sm" onclick="openEditClan('${clan.id}')">✏️ Редактировать</button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateFooterStats();
        }

        // ============================================================
        // РЕНДЕР ЗАЯВОК
        // ============================================================
        async function renderRequests(container) {
            await refreshData();
            const myClan = allClans.find(c => c.leaderId === currentUser.id);
            if (!myClan) {
                container.innerHTML = `<div class="empty"><span class="icon">📩</span><p>Вы не глава клана</p></div>`;
                return;
            }
            const pending = allRequests.filter(r => r.clanId === myClan.id && r.status === 'pending');
            if (!pending.length) {
                container.innerHTML = `<div class="empty"><span class="icon">✅</span><p>Нет заявок</p></div>`;
                return;
            }
            let html = `<div style="color:var(--text-secondary);margin-bottom:8px;">📨 Заявки (${pending.length})</div>`;
            pending.forEach(req => {
                const user = allUsers.find(u => u.id === req.userId);
                html += `
                    <div class="request-item">
                        <div><div class="req-name">${user ? user.name : 'Игрок'}</div><div class="req-date">ID: ${req.userId}</div></div>
                        <div>
                            <button class="btn btn-success btn-sm" onclick="acceptRequest('${req.id}')">✅</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectRequest('${req.id}')">❌</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ============================================================
        // РЕНДЕР МОЙ КЛАН
        // ============================================================
        async function renderMyClan(container) {
            await refreshData();
            let clan = allClans.find(c => c.id === currentUser.clanId);
            if (!clan && currentUser.role === 'leader') {
                clan = allClans.find(c => c.leaderId === currentUser.id);
                if (clan) {
                    currentUser.clanId = clan.id;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                    try {
                        const data = await loadData();
                        const user = data.users.find(u => u.id === currentUser.id);
                        if (user) { user.clanId = clan.id;
                            await saveData(data); }
                    } catch (e) {}
                }
            }
            if (!clan) {
                container.innerHTML = `<div class="empty"><span class="icon">⭐</span><p>Вы не состоите в клане</p></div>`;
                return;
            }
            const members = clan.members || [];
            const isLeader = clan.leaderId === currentUser.id;
            const leader = getClanLeader(clan);
            const elo = getClanElo(clan.id);
            let memHtml = '';
            members.forEach(mid => {
                const user = allUsers.find(u => u.id === mid);
                memHtml += `<div class="member-row"><span>${user ? user.name : mid}</span><span class="role-tag">${mid === clan.leaderId ? '👑 Глава' : 'Участник'}</span></div>`;
            });

            let extra = '';
            if (clan.contact) extra += `<div style="color:var(--text-secondary);font-size:13px;margin-top:4px;">📱 Связь: @${clan.contact}</div>`;
            if (clan.channel) extra += `<div style="color:var(--text-secondary);font-size:13px;">📢 Канал: ${clan.channel}</div>`;

            container.innerHTML = `
                <div class="card" style="border-color:var(--accent);">
                    <div class="card-header"><span class="card-title">${clan.name}</span><span class="card-tag">[${clan.tag}]</span></div>
                    <div class="card-sub"><span class="badge-online"></span> Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length} • ⭐ ${elo} elo</div>
                    ${clan.description ? `<div style="color:var(--text-secondary);font-size:13px;">${clan.description}</div>` : ''}
                    ${extra}
                    <div style="margin-top:8px;">${memHtml}</div>
                    <div class="card-actions">
                        ${isLeader ? `<button class="btn btn-danger btn-sm" onclick="deleteClan('${clan.id}')">🗑 Распустить</button>` : ''}
                        ${(isLeader || isAdmin(currentUser)) ? `<button class="btn btn-primary btn-sm" onclick="openEditClan('${clan.id}')">✏️ Редактировать</button>` : ''}
                    </div>
                </div>
            `;
            updateFooterStats();
        }

        // ============================================================
        // РЕНДЕР РЕЙТИНГА (ТАБЛИЦА BEST CLANS)
        // ============================================================
        async function renderRating(container) {
            await refreshData();

            if (!ratings.length || !allClans.length) {
                container.innerHTML = `<div class="empty"><span class="icon">🏆</span><p>Нет данных для рейтинга</p></div>`;
                return;
            }

            // Сортируем кланы по ELO (по убыванию)
            const sorted = [...ratings].sort((a, b) => (b.elo || 0) - (a.elo || 0));

            // Берём только те, которые есть в allClans (активные)
            const activeRatings = sorted.filter(r => allClans.some(c => c.id === r.id));

            if (!activeRatings.length) {
                container.innerHTML = `<div class="empty"><span class="icon">🏆</span><p>Нет кланов с рейтингом</p></div>`;
                return;
            }

            let html = `
                <div style="margin-bottom:12px;color:var(--text-secondary);font-size:14px;">
                    🏆 Рейтинг кланов (по ELO)
                </div>
                <div class="rating-table">
            `;

            activeRatings.forEach((r, index) => {
                const place = index + 1;
                let placeClass = '';
                let medal = '';
                if (place === 1) { placeClass = 'gold';
                    medal = '🥇'; } else if (place === 2) { placeClass = 'silver';
                    medal = '🥈'; } else if (place === 3) { placeClass = 'bronze';
                    medal = '🥉'; }

                html += `
                    <div class="rating-row">
                        <span class="place ${placeClass}">${medal || place}</span>
                        <div class="clan-info">
                            <span class="name">${r.name || 'Неизвестно'}</span>
                            <span class="tag">[${r.tag || '??'}]</span>
                        </div>
                        <span class="elo">${r.elo || 0} ELO</span>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // ============================================================
        // РЕНДЕР АДМИНКИ (с управлением рейтингом)
        // ============================================================
        async function renderAdmin(container) {
            if (!isAdmin(currentUser)) {
                container.innerHTML = `<div class="empty">⛔ Доступ запрещён</div>`;
                return;
            }
            await refreshData();

            let html = `
                <div class="card" style="border-color:#f1c40f;">
                    <div style="display:flex;justify-content:space-between;">
                        <h3>🛡️ Админ-панель</h3>
                        <span style="color:#f1c40f;font-size:12px;">Админ</span>
                    </div>
                    <div style="color:var(--text-secondary);font-size:13px;">
                        Кланов: ${allClans.length} | Пользователей: ${allUsers.length} | Заявок: ${allRequests.filter(r => r.status === 'pending').length}
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="clearAllData()" style="margin-top:8px;">⚠️ Очистить всё</button>
                </div>
            `;

            // Управление рейтингом
            html += `
                <div class="card" style="border-color:var(--accent);">
                    <h4>⚡ Управление рейтингом (ELO)</h4>
                    <div style="color:var(--text-secondary);font-size:13px;margin-bottom:8px;">
                        Изменяй ELO для любого клана. Данные сохранятся в BrewPage.
                    </div>
                    <div id="ratingAdminList"></div>
                </div>
            `;

            // Список кланов для редактирования рейтинга
            let listHtml = '';
            const sortedClans = [...allClans].sort((a, b) => {
                const eloA = getClanElo(a.id);
                const eloB = getClanElo(b.id);
                return eloB - eloA;
            });

            sortedClans.forEach(clan => {
                const elo = getClanElo(clan.id);
                listHtml += `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                        <div>
                            <strong>${clan.name}</strong> <span style="color:var(--text-secondary);font-size:12px;">[${clan.tag}]</span>
                            <span style="color:var(--accent);margin-left:8px;">${elo} ELO</span>
                        </div>
                        <div style="display:flex;gap:6px;align-items:center;">
                            <input type="number" id="elo_input_${clan.id}" value="${elo}" style="width:60px;padding:4px 6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:var(--text-primary);font-size:13px;">
                            <button class="btn btn-primary btn-sm" onclick="adminSetElo('${clan.id}')">💾</button>
                        </div>
                    </div>
                `;
            });

            html = html.replace('</div>', listHtml + '</div></div>');

            container.innerHTML = html;
        }

        // ============================================================
        // АДМИН: УСТАНОВИТЬ ELO
        // ============================================================
        async function adminSetElo(clanId) {
            const input = document.getElementById(`elo_input_${clanId}`);
            if (!input) return;
            const newElo = parseInt(input.value);
            if (isNaN(newElo) || newElo < 0) {
                showToast('❌ Введите корректное число', 'error');
                return;
            }

            try {
                // Находим клан в BrewPage
                const resp = await fetch(BREWPAGE_URL);
                const data = await resp.json();
                if (!data.clans) data.clans = [];

                const clan = data.clans.find(c => c.id === clanId);
                if (clan) {
                    clan.elo = newElo;
                } else {
                    // Если клана нет в рейтинге — добавляем
                    const clanFromMain = allClans.find(c => c.id === clanId);
                    if (clanFromMain) {
                        data.clans.push({
                            id: clanId,
                            name: clanFromMain.name,
                            tag: clanFromMain.tag,
                            elo: newElo
                        });
                    } else {
                        showToast('❌ Клан не найден', 'error');
                        return;
                    }
                }

                // Обновляем через PUT (если бы BrewPage поддерживал)
                // Пока просто обновляем локально и показываем инструкцию
                showToast(`✅ ELO для клана обновлён до ${newElo} (локально)`, 'success');

                // Обновляем локальный рейтинг
                const localClan = ratings.find(r => r.id === clanId);
                if (localClan) {
                    localClan.elo = newElo;
                } else {
                    const clanFromMain = allClans.find(c => c.id === clanId);
                    if (clanFromMain) {
                        ratings.push({
                            id: clanId,
                            name: clanFromMain.name,
                            tag: clanFromMain.tag,
                            elo: newElo
                        });
                    }
                }

                // Перерисовываем админку и обновляем остальные вкладки
                renderAdmin(document.getElementById('content'));
                showTab('clans');

                // Инструкция для BrewPage
                showToast('⚠️ Для сохранения на BrewPage скачай rating.json и загрузи заново', 'info');

            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // ДЕЙСТВИЯ С КЛАНАМИ
        // ============================================================
        function openCreateClan() {
            if (currentUser.clanId) return showToast('❌ Вы уже в клане', 'error');
            document.getElementById('newClanName').value = '';
            document.getElementById('newClanTag').value = '';
            document.getElementById('newClanDesc').value = '';
            document.getElementById('createClanModal').classList.add('show');
        }

        async function createClan() {
            const name = document.getElementById('newClanName').value.trim();
            const tag = document.getElementById('newClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('newClanDesc').value.trim();
            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                if (data.clans.find(c => c.name.toLowerCase() === name.toLowerCase())) return showToast('❌ Клан существует', 'error');

                const newClan = {
                    id: 'clan_' + Date.now(),
                    name,
                    tag,
                    leaderId: currentUser.id,
                    members: [currentUser.id],
                    description: desc,
                    contact: '',
                    channel: '',
                    created: new Date().toISOString()
                };
                data.clans.push(newClan);
                await saveData(data);

                // Добавляем клан в рейтинг (BrewPage)
                try {
                    const resp = await fetch(BREWPAGE_URL);
                    const brewData = await resp.json();
                    if (!brewData.clans) brewData.clans = [];
                    brewData.clans.push({
                        id: newClan.id,
                        name: name,
                        tag: tag,
                        elo: 0
                    });
                    // Временно сохраняем локально
                    ratings.push({
                        id: newClan.id,
                        name: name,
                        tag: tag,
                        elo: 0
                    });
                    showToast('⚠️ Для сохранения рейтинга обнови файл на BrewPage', 'info');
                } catch (e) {
                    console.warn('BrewPage error:', e);
                }

                currentUser.clanId = newClan.id;
                currentUser.role = 'leader';
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                const userInDb = data.users.find(u => u.id === currentUser.id);
                if (userInDb) {
                    userInDb.clanId = newClan.id;
                    userInDb.role = 'leader';
                    await saveData(data);
                }

                await refreshData();
                closeModal('createClanModal');
                showToast('✅ Клан создан!', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        function openEditClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
            editingClanId = clanId;
            document.getElementById('editClanName').value = clan.name;
            document.getElementById('editClanTag').value = clan.tag;
            document.getElementById('editClanDesc').value = clan.description || '';
            document.getElementById('editClanContact').value = clan.contact || '';
            document.getElementById('editClanChannel').value = clan.channel || '';
            document.getElementById('editClanModal').classList.add('show');
        }

        async function saveEditClan() {
            const name = document.getElementById('editClanName').value.trim();
            const tag = document.getElementById('editClanTag').value.trim().toUpperCase();
            const desc = document.getElementById('editClanDesc').value.trim();
            const contact = document.getElementById('editClanContact').value.trim();
            const channel = document.getElementById('editClanChannel').value.trim();

            if (!name) return showToast('❌ Введите название', 'error');
            if (!tag || tag.length < 2 || tag.length > 6) return showToast('❌ Тег 2-6 символов', 'error');

            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === editingClanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                clan.name = name;
                clan.tag = tag;
                clan.description = desc;
                clan.contact = contact;
                clan.channel = channel;

                await saveData(data);
                await refreshData();
                closeModal('editClanModal');
                showToast('✅ Клан обновлён', 'success');
                showTab(currentTab);
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // ОСТАЛЬНЫЕ ФУНКЦИИ (без изменений)
        // ============================================================
        async function viewClan(clanId) {
            await refreshData();
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');

            const members = clan.members || [];
            const leader = getClanLeader(clan);
            const isLeader = clan.leaderId === currentUser.id;
            const isAdminUser = isAdmin(currentUser);
            const canManage = isLeader || isAdminUser;
            const elo = getClanElo(clan.id);

            let extra = '';
            if (clan.contact) extra += `<div style="color:var(--text-secondary);font-size:13px;">📱 Связь: @${clan.contact}</div>`;
            if (clan.channel) extra += `<div style="color:var(--text-secondary);font-size:13px;">📢 Канал: ${clan.channel}</div>`;

            document.getElementById('detailClanName').textContent = `🏰 ${clan.name} [${clan.tag}]`;
            document.getElementById('detailClanInfo').innerHTML = `
                <div style="color:var(--text-secondary);font-size:14px;">Глава: ${leader ? leader.name : 'Неизвестен'} • 👥 ${members.length} • ⭐ ${elo} elo</div>
                ${clan.description ? `<div style="color:var(--text-secondary);font-size:13px;">${clan.description}</div>` : ''}
                ${extra}
            `;

            let memHtml = '';
            members.forEach(mid => {
                const user = allUsers.find(u => u.id === mid);
                const isLeaderUser = mid === clan.leaderId;
                const isCurrentUser = mid === currentUser.id;
                let actions = '';
                if (canManage && !isLeaderUser && mid !== currentUser.id) {
                    actions = `<button class="btn btn-danger btn-sm" onclick="kickMember('${clan.id}','${mid}')">Кикнуть</button>
                               <button class="btn btn-gold btn-sm" onclick="transferLeadership('${clan.id}','${mid}')">👑 Назначить</button>`;
                }
                if (isCurrentUser && !isLeaderUser) {
                    actions += `<button class="btn btn-danger btn-sm" onclick="confirmLeaveFromView('${clan.id}')">🚪 Покинуть</button>`;
                }
                memHtml += `<div class="member-row"><span>${user ? user.name : mid} ${isLeaderUser ? '👑' : ''}</span><div class="actions">${actions}</div></div>`;
            });
            document.getElementById('detailMembers').innerHTML = memHtml || '<div style="color:var(--text-secondary);">Нет участников</div>';
            document.getElementById('clanDetailModal').classList.add('show');
        }

        function confirmLeaveFromView(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (confirm(`Выйти из клана "${clan.name}"?`)) {
                leaveClan(clanId);
                closeModal('clanDetailModal');
            }
        }

        async function applyToClan(clanId) {
            if (currentUser.clanId) return showToast('❌ Вы уже в клане', 'error');
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (allRequests.find(r => r.clanId === clanId && r.userId === currentUser.id && r.status === 'pending')) {
                return showToast('⏳ Заявка уже отправлена', 'info');
            }
            if (!confirm(`Подать заявку в "${clan.name}"?`)) return;
            try {
                const data = await loadData();
                data.requests.push({
                    id: 'req_' + Date.now(),
                    clanId,
                    userId: currentUser.id,
                    userName: currentUser.name,
                    status: 'pending',
                    created: new Date().toISOString()
                });
                await saveData(data);
                await refreshData();
                showToast('✅ Заявка отправлена', 'success');
                showTab('clans');
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function acceptRequest(reqId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === reqId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');
                const clan = data.clans.find(c => c.id === req.clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (!clan.members) clan.members = [];
                if (!clan.members.includes(req.userId)) clan.members.push(req.userId);
                req.status = 'accepted';
                const user = data.users.find(u => u.id === req.userId);
                if (user) {
                    user.clanId = clan.id;
                }
                await saveData(data);
                await refreshData();
                showToast('✅ Заявка принята', 'success');
                showTab('requests');
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function rejectRequest(reqId) {
            try {
                const data = await loadData();
                const req = data.requests.find(r => r.id === reqId);
                if (!req) return showToast('❌ Заявка не найдена', 'error');
                req.status = 'rejected';
                await saveData(data);
                await refreshData();
                showToast('❌ Заявка отклонена', 'error');
                showTab('requests');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function deleteClan(clanId) {
            const clan = allClans.find(c => c.id === clanId);
            if (!clan) return showToast('❌ Клан не найден', 'error');
            if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
            if (!confirm(`Удалить клан "${clan.name}"?`)) return;

            try {
                const data = await loadData();
                data.clans = data.clans.filter(c => c.id !== clanId);
                data.requests = data.requests.filter(r => r.clanId !== clanId);
                data.users.forEach(u => { if (u.clanId === clanId) u.clanId = null; });
                if (currentUser.clanId === clanId) {
                    currentUser.clanId = null;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
                // Удаляем из рейтинга
                ratings = ratings.filter(r => r.id !== clanId);
                await saveData(data);
                await refreshData();
                showToast('✅ Клан удалён', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function leaveClan(clanId) {
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId === currentUser.id) return showToast('❌ Вы глава, сначала передайте лидерство', 'error');
                clan.members = clan.members.filter(m => m !== currentUser.id);
                currentUser.clanId = null;
                localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                const user = data.users.find(u => u.id === currentUser.id);
                if (user) user.clanId = null;
                await saveData(data);
                await refreshData();
                showToast('✅ Вы вышли из клана', 'success');
                updateUI();
                showTab('clans');
                renderMainActionButton();
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function kickMember(clanId, userId) {
            if (!confirm('Кикнуть игрока?')) return;
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');
                if (userId === clan.leaderId) return showToast('❌ Нельзя кикнуть лидера', 'error');
                clan.members = clan.members.filter(id => id !== userId);
                const user = data.users.find(u => u.id === userId);
                if (user) user.clanId = null;
                await saveData(data);
                await refreshData();
                showToast('✅ Игрок кикнут', 'success');
                viewClan(clanId);
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function transferLeadership(clanId, newLeaderId) {
            if (!confirm('Передать лидерство?')) return;
            try {
                const data = await loadData();
                const clan = data.clans.find(c => c.id === clanId);
                if (!clan) return showToast('❌ Клан не найден', 'error');
                if (clan.leaderId !== currentUser.id && !isAdmin(currentUser)) return showToast('❌ Нет прав', 'error');

                const newLeader = data.users.find(u => u.id === newLeaderId);
                if (!newLeader) return showToast('❌ Пользователь не найден', 'error');

                const oldLeaderId = clan.leaderId;
                clan.leaderId = newLeaderId;
                newLeader.clanId = clan.id;
                newLeader.role = 'leader';

                const oldLeader = data.users.find(u => u.id === oldLeaderId);
                if (oldLeader) {
                    oldLeader.role = 'member';
                }

                await saveData(data);
                await refreshData();

                if (currentUser.id === newLeaderId) {
                    currentUser.role = 'leader';
                    currentUser.clanId = clan.id;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }

                showToast(`✅ Лидерство передано ${newLeader.name}`, 'success');
                viewClan(clanId);
                renderMainActionButton();
                updateFooterStats();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ============================================================
        // АДМИН ФУНКЦИИ (удаление, бан)
        // ============================================================
        async function adminDeleteUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя удалить админа', 'error');
            if (!confirm(`Удалить пользователя "${user.name}"?`)) return;

            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== userId);
                data.clans.forEach(c => { if (c.members) c.members = c.members.filter(m => m !== userId); if (c.leaderId === userId) { const newL = c.members && c.members.length ? c.members[0] : null;
                        if (newL) { const lu = data.users.find(u => u.id === newL);
                            c.leaderId = newL;
                            c.leaderName = lu ? lu.name : 'Неизвестен'; } else { data.clans = data.clans.filter(cl => cl.id !== c.id); } } });
                data.requests = data.requests.filter(r => r.userId !== userId);
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} удалён`, 'success');
                showTab('admin');
                updateFooterStats();
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function adminBanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (isAdmin(user)) return showToast('❌ Нельзя забанить админа', 'error');
            if (!confirm(`Забанить "${user.name}"?`)) return;
            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) target.banned = true;
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} забанен`, 'success');
                showTab('admin');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function adminUnbanUser(userId) {
            if (!isAdmin(currentUser)) return showToast('⛔ Доступ запрещён', 'error');
            const user = allUsers.find(u => u.id === userId);
            if (!user) return showToast('❌ Пользователь не найден', 'error');
            if (!confirm(`Разбанить "${user.name}"?`)) return;
            try {
                const data = await loadData();
                const target = data.users.find(u => u.id === userId);
                if (target) target.banned = false;
                await saveData(data);
                await refreshData();
                showToast(`✅ ${user.name} разбанен`, 'success');
                showTab('admin');
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        async function clearAllData() {
            if (!isAdmin(currentUser)) return;
            if (!confirm('⚠️ Очистить всё?')) return;
            try {
                const data = await loadData();
                data.users = [];
                data.clans = [];
                data.requests = [];
                await saveData(data);
                await refreshData();
                showToast('✅ Очищено', 'success');
                location.reload();
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        async function refreshData() {
            const data = await loadData();
            allUsers = data.users || [];
            allClans = data.clans || [];
            allRequests = data.requests || [];
            await loadRatings();
            if (currentUser) {
                const updated = allUsers.find(u => u.id === currentUser.id);
                if (updated) {
                    currentUser = updated;
                    localStorage.setItem('bsc_user', JSON.stringify(currentUser));
                }
            }
            updateUI();
            updateFooterStats();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function toggleProfile() {
            const dd = document.getElementById('profileDropdown');
            dd.classList.toggle('show');
        }

        async function logoutUser() {
            if (!confirm('Выйти из аккаунта?')) return;
            try {
                const data = await loadData();
                data.users = data.users.filter(u => u.id !== currentUser.id);
                data.clans.forEach(c => { if (c.members) c.members = c.members.filter(m => m !== currentUser.id); if (c.leaderId === currentUser.id) { const nl = c.members && c.members.length ? c.members[0] : null; if (nl) { const lu = data.users.find(u => u.id === nl);
                            c.leaderId = nl;
                            c.leaderName = lu ? lu.name : 'Неизвестен'; } else { data.clans = data.clans.filter(cl => cl.id !== c.id); } } });
                await saveData(data);
                localStorage.removeItem('bsc_user');
                localStorage.removeItem('bsc_test_id');
                currentUser = null;
                allUsers = data.users;
                allClans = data.clans;
                allRequests = data.requests;
                document.getElementById('registerModal').classList.add('show');
                updateUI();
                showTab('clans');
                renderMainActionButton();
                showToast('✅ Вы вышли', 'success');
                updateFooterStats();
            } catch (e) { showToast('❌ ' + e.message, 'error'); }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
